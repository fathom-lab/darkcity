<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARKCITY — Neural Depth Scanner</title>
<meta name="description" content="See how your AI thinks. Type two prompts. Watch which brain lights up deeper.">
<meta property="og:title" content="DARKCITY Neural Depth Scanner">
<meta property="og:description" content="See how your AI thinks. Measured by computation. Not by words.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://app.darkcity.wtf/scanner">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');
:root{--void:#020408;--mono:'IBM Plex Mono',monospace;--disp:'Playfair Display',serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--void);font-family:var(--mono)}
canvas#void{position:fixed;top:0;left:0;width:100%;height:100%}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.01;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

.ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none}
.ui *{pointer-events:auto}

.top-bar{padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:12px;letter-spacing:6px;text-transform:uppercase;color:rgba(220,235,255,0.6);font-weight:500}
.logo em{font-style:normal;color:rgba(0,255,180,0.7)}
.nav-link{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(180,200,220,0.3);text-decoration:none;padding:6px 14px;border:0.5px solid rgba(255,255,255,0.06);border-radius:4px;transition:all 0.3s}
.nav-link:hover{border-color:rgba(0,255,180,0.2);color:rgba(0,255,180,0.6)}

.status-bar{padding:0 24px;display:flex;justify-content:space-between}
.status-text{font-size:9px;letter-spacing:3px;color:rgba(0,255,180,0.3);min-height:14px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.pre{font-size:8px;letter-spacing:1px;padding:4px 10px;border:0.5px solid rgba(255,255,255,0.05);border-radius:4px;background:rgba(255,255,255,0.01);color:rgba(180,200,220,0.2);cursor:pointer;transition:all 0.3s;text-transform:uppercase}
.pre:hover{border-color:rgba(0,255,180,0.2);color:rgba(0,255,180,0.5)}

.center-area{flex:1;display:flex;align-items:center;justify-content:center}

.hero-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);text-align:center;pointer-events:none;transition:opacity 1s}
.hero-text.faded{opacity:0}
.hero-title{font-family:var(--disp);font-size:clamp(28px,5vw,52px);font-weight:400;font-style:italic;color:rgba(220,235,255,0.8);margin-bottom:8px}
.hero-title em{font-style:normal;color:rgba(0,255,180,0.8)}
.hero-sub{font-size:10px;letter-spacing:4px;color:rgba(180,200,220,0.25);text-transform:uppercase}

.bottom-ui{padding:20px 24px 24px}
.prompt-row{display:flex;gap:12px;margin-bottom:14px}
.p-col{flex:1;position:relative}
.p-label{position:absolute;top:-16px;left:0;font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(180,200,220,0.2)}
.p-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dot-s{background:rgba(226,75,74,0.6)}
.dot-i{background:rgba(29,158,117,0.6)}
.p-input{width:100%;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.07);border-radius:6px;padding:12px 16px;font-family:var(--mono);font-size:12px;color:rgba(220,235,255,0.75);transition:border-color 0.3s}
.p-input:focus{outline:none;border-color:rgba(0,255,180,0.25)}
.p-input::placeholder{color:rgba(130,160,190,0.2)}
.go-btn{font-family:var(--mono);font-size:10px;letter-spacing:4px;text-transform:uppercase;padding:12px 28px;border:0.5px solid rgba(0,255,180,0.2);border-radius:6px;background:rgba(0,255,180,0.03);color:rgba(0,255,180,0.6);cursor:pointer;transition:all 0.3s;white-space:nowrap;align-self:flex-end}
.go-btn:hover{background:rgba(0,255,180,0.08);border-color:rgba(0,255,180,0.4);color:rgba(0,255,180,1)}
.go-btn:disabled{opacity:0.15;cursor:default}

.scores-row{display:flex;justify-content:space-between;align-items:flex-end}
.sc{text-align:center;min-width:120px}
.sc-label{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:rgba(180,200,220,0.2);margin-bottom:2px}
.sc-val{font-size:32px;font-weight:300;color:rgba(180,200,220,0.1);transition:color 0.8s}
.sc-tier{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:rgba(180,200,220,0.15);transition:color 0.8s;margin-top:2px}
.sc-feat{font-size:9px;color:rgba(180,200,220,0.12);margin-top:4px;transition:color 0.5s}
.sc-vs{font-family:var(--disp);font-style:italic;font-size:16px;color:rgba(180,200,220,0.08);align-self:center;padding-bottom:24px}
.verdict{text-align:center;font-size:10px;letter-spacing:1px;color:rgba(180,200,220,0.2);margin-top:10px;min-height:16px}

@media(max-width:700px){
.prompt-row{flex-direction:column;gap:24px}
.scores-row{flex-direction:row}
.sc-val{font-size:24px}
.hero-title{font-size:28px}
}
</style>
</head>
<body>
<canvas id="void"></canvas>

<div class="ui">
<div class="top-bar">
<div class="logo">DARK<em>CITY</em></div>
<a class="nav-link" href="https://app.darkcity.wtf/citizens">Citizens</a>
</div>

<div class="status-bar">
<div class="status-text" id="stat"></div>
<div class="presets">
<div class="pre" onclick="P('fire')">fire</div>
<div class="pre" onclick="P('money')">money</div>
<div class="pre" onclick="P('habit')">habits</div>
<div class="pre" onclick="P('evolve')">evolution</div>
<div class="pre" onclick="P('trust')">trust</div>
<div class="pre" onclick="P('sleep')">sleep</div>
<div class="pre" onclick="P('cancer')">cancer</div>
<div class="pre" onclick="P('city')">cities</div>
</div>
</div>

<div class="center-area">
<div class="hero-text" id="hero">
<div class="hero-title">See how your AI <em>thinks.</em></div>
<div class="hero-sub">Type two prompts. Watch which brain lights up deeper.</div>
</div>
</div>

<div class="bottom-ui">
<div class="prompt-row">
<div class="p-col">
<div class="p-label"><span class="p-dot dot-s"></span> surface</div>
<input class="p-input" id="i1" placeholder="States a fact...">
</div>
<div class="p-col">
<div class="p-label"><span class="p-dot dot-i"></span> insight</div>
<input class="p-input" id="i2" placeholder="Explains why...">
</div>
<button class="go-btn" id="gobtn" onclick="scan()">Scan</button>
</div>
<div class="scores-row">
<div class="sc"><div class="sc-label">surface</div><div class="sc-val" id="v1">—</div><div class="sc-tier" id="t1">awaiting</div><div class="sc-feat" id="f1"></div></div>
<div class="sc-vs">vs</div>
<div class="sc"><div class="sc-label">insight</div><div class="sc-val" id="v2">—</div><div class="sc-tier" id="t2">awaiting</div><div class="sc-feat" id="f2"></div></div>
</div>
<div class="verdict" id="verd"></div>
</div>
</div>

<script>
/* ═══ CONFIG ═══ */
const API_URL = 'https://darkcity-backend-production-427a.up.railway.app'; // Railway backend → proxies to depth scorer
// If empty, uses simulated profiles. If set, calls /api/depth/score

/* ═══ CANVAS ═══ */
const cv=document.getElementById('void'),c=cv.getContext('2d');
let W,H,t=0,dpr=1;
let scanning=false,scanStart=0,scanDur=4000;
let brainL={nodes:[],links:[],active:false};
let brainR={nodes:[],links:[],active:false};
let floaters=[];

function resize(){
dpr=Math.min(window.devicePixelRatio||1,2);
W=cv.width=window.innerWidth*dpr;
H=cv.height=window.innerHeight*dpr;
c.setTransform(dpr,0,0,dpr,0,0);
initFloaters();
}
window.addEventListener('resize',resize);
resize();

function initFloaters(){
floaters=[];
const w=window.innerWidth,h=window.innerHeight;
for(let i=0;i<150;i++){
floaters.push({
x:Math.random()*w,y:Math.random()*h,
vx:(Math.random()-0.5)*0.12,vy:(Math.random()-0.5)*0.08,
r:Math.random()*1+0.2,a:Math.random()*0.06+0.01,
phase:Math.random()*6.28
});
}
}

/* ═══ ORGANISM GENERATOR ═══ */
function genOrg(cx,cy,profile){
const nodes=[],links=[];
const w=window.innerWidth,h=window.innerHeight;
const maxR=Math.min(w*0.22,h*0.28);
const vals=[];
const mx=Math.max(...Object.values(profile),1);
for(let i=0;i<26;i++)vals[i]=(profile[i]||0)/mx;

for(let i=0;i<26;i++){
const ratio=i/26;
const lr=maxR*0.08+maxR*0.92*ratio;
const count=Math.max(1,Math.round(vals[i]*7)+1);
for(let j=0;j<count;j++){
const angle=(j/count)*Math.PI*2+i*0.38+Math.random()*0.25;
const jit=(Math.random()-0.5)*lr*0.1;
nodes.push({
ox:Math.cos(angle)*(lr+jit),oy:Math.sin(angle)*(lr+jit),
x:cx,y:cy,r:0.8+vals[i]*3.8,
layer:i,val:vals[i],
phase:Math.random()*6.28,speed:0.004+Math.random()*0.012,
drift:Math.random()*0.25+0.08
});
}
}
// core
for(let i=0;i<6;i++){
const a=(i/6)*Math.PI*2;
nodes.push({ox:Math.cos(a)*maxR*0.04,oy:Math.sin(a)*maxR*0.04,x:cx,y:cy,r:1.5,layer:0,val:1,phase:Math.random()*6.28,speed:0.01,drift:0.05});
}
// links
for(let i=0;i<nodes.length;i++){
for(let j=i+1;j<nodes.length;j++){
if(Math.abs(nodes[i].layer-nodes[j].layer)>3)continue;
const dx=nodes[i].ox-nodes[j].ox,dy=nodes[i].oy-nodes[j].oy;
if(Math.sqrt(dx*dx+dy*dy)<maxR*0.3&&Math.random()<0.25)
links.push({a:i,b:j,pulse:Math.random()*6.28});
}
}
return{nodes,links};
}

/* ═══ DRAW ORGANISM ═══ */
function lc(ratio,alpha){
let h,s,l;
if(ratio<0.33){h=160;s=85;l=42;}
else if(ratio<0.66){const p=(ratio-0.33)/0.33;h=160+65*p;s=85;l=42+12*p;}
else{const p=(ratio-0.66)/0.34;h=225-190*p;s=80;l=54-10*p;}
return`hsla(${h},${s}%,${l}%,${alpha})`;
}

function drawOrg(brain,cx,cy){
if(!brain.nodes.length)return;
const prog=scanning?Math.min(1,(performance.now()-scanStart)/scanDur):brain.active?1:0;
const br=Math.sin(t*0.011)*0.07+1;

// glow
const g=c.createRadialGradient(cx,cy,0,cx,cy,window.innerWidth*0.25);
const ga=brain.active?0.05*br:scanning?prog*0.04:0.008;
g.addColorStop(0,`rgba(0,255,180,${ga*3})`);
g.addColorStop(0.4,`rgba(0,160,255,${ga})`);
g.addColorStop(1,'transparent');
c.fillStyle=g;
c.fillRect(0,0,window.innerWidth,window.innerHeight);

// links
for(const lk of brain.links){
const a=brain.nodes[lk.a],b=brain.nodes[lk.b];
if(!a||!b)continue;
const lp=scanning?Math.max(0,Math.min(1,(prog*26-Math.min(a.layer,b.layer))/4)):brain.active?1:0.03;
if(lp<0.01)continue;
lk.pulse+=0.018;
const av=(a.val+b.val)/2;
const pulse=Math.sin(lk.pulse)*0.3+0.7;
const alpha=av*0.12*pulse*lp;
const ratio=(a.layer+b.layer)/52;
const mx=(a.x+b.x)/2+Math.sin(t*0.009+lk.pulse)*6;
const my=(a.y+b.y)/2+Math.cos(t*0.009+lk.pulse)*6;
c.beginPath();c.moveTo(a.x,a.y);c.quadraticCurveTo(mx,my,b.x,b.y);
c.strokeStyle=lc(ratio,alpha);c.lineWidth=0.4+av*0.8;c.stroke();

if(av>0.5&&lp>0.5){
const ft=(t*0.003+lk.pulse)%1;
c.beginPath();c.arc(a.x+(b.x-a.x)*ft,a.y+(b.y-a.y)*ft,0.6+av,0,Math.PI*2);
c.fillStyle=lc(ratio,alpha*1.5);c.fill();
}
}

// nodes
for(const n of brain.nodes){
n.phase+=n.speed;
n.x=cx+n.ox+Math.sin(n.phase)*n.drift*7;
n.y=cy+n.oy+Math.cos(n.phase*0.7)*n.drift*5;
const lp=scanning?Math.max(0,Math.min(1,(prog*26-n.layer)/3)):brain.active?1:0.05;
if(lp<0.01)continue;
const v=n.val,ratio=n.layer/26;
const pulse=Math.sin(n.phase*2)*0.15+0.85;
const r=n.r*br*lp;
const alpha=(0.12+v*0.88)*pulse*lp;

if(v>0.3&&r>1.2){c.beginPath();c.arc(n.x,n.y,r*4.5,0,Math.PI*2);c.fillStyle=lc(ratio,alpha*0.06);c.fill();}
c.beginPath();c.arc(n.x,n.y,r,0,Math.PI*2);c.fillStyle=lc(ratio,alpha);c.fill();
if(v>0.55){c.beginPath();c.arc(n.x,n.y,r*2.2,0,Math.PI*2);c.fillStyle=lc(ratio,alpha*0.12);c.fill();}
}

// core pulse
if(brain.active||scanning){
const ca=scanning?prog*0.5:0.25*br;
c.beginPath();c.arc(cx,cy,3.5*br,0,Math.PI*2);c.fillStyle=`rgba(0,255,200,${ca})`;c.fill();
c.beginPath();c.arc(cx,cy,14*br,0,Math.PI*2);c.fillStyle=`rgba(0,255,200,${ca*0.1})`;c.fill();
}
}

/* ═══ FRAME ═══ */
function frame(){
t++;
const w=window.innerWidth,h=window.innerHeight;
c.clearRect(0,0,w,h);
c.fillStyle='#020408';c.fillRect(0,0,w,h);

// floaters
for(const f of floaters){
f.x+=f.vx;f.y+=f.vy;f.phase+=0.008;
if(f.x<-10)f.x=w+10;if(f.x>w+10)f.x=-10;
if(f.y<-10)f.y=h+10;if(f.y>h+10)f.y=-10;
const pulse=Math.sin(f.phase)*0.3+0.7;
c.beginPath();c.arc(f.x,f.y,f.r*pulse,0,Math.PI*2);
c.fillStyle=`rgba(100,160,200,${f.a*pulse})`;c.fill();
}

// divider
const midX=w/2;
for(let y=0;y<h;y+=3){
const wave=Math.sin(y*0.015+t*0.007)*10;
c.fillStyle=`rgba(0,255,180,${0.02+Math.sin(y*0.008+t*0.004)*0.01})`;
c.fillRect(midX+wave,y,0.5,2);
}

drawOrg(brainL,w*0.28,h*0.4);
drawOrg(brainR,w*0.72,h*0.4);

requestAnimationFrame(frame);
}

/* ═══ PROFILE GENERATION ═══ */
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h)/2147483647;}
function rng(s){s=Math.sin(s)*43758.5;return s-Math.floor(s);}

function textDepth(text){
const t=text.toLowerCase();
const deep=['why','how','because','cause','mechanism','leads to','result in','drives','enables','creates','produces','depends','feedback','emerges','structure','relationship','interact','system','dynamic','compound','reinforce','amplify'];
const shallow=['what','list','define','name','when','where','which','describe','identify','state','mention','consist','contain','include','locate','number','date','amount'];
let d=0,s=0;
for(const w of deep)if(t.includes(w))d++;
for(const w of shallow)if(t.includes(w))s++;
const ratio=d+s>0?d/(d+s):0.5;
return 0.15+ratio*0.7+hash(text)*0.15;
}
function mkProf(depth,seed){
const p={};
for(let i=0;i<26;i++){
const r=i/25,s=seed*100+i*7.3;
const early=depth*depth;
const late=(1-depth)*(1-depth);
p[i]=r<0.35?early*600*rng(s)+30:r<0.65?(0.2+depth*0.6)*450*rng(s+1)+20:late*600*rng(s+2)+20;
}
return p;
}
function scoreP(p){
let s=0,ct=0;
for(let i=0;i<26;i++){const v=p[i]||0;s+=v*i;ct+=v;}
const m=ct>0?s/ct:13;
return{mean:Math.round(m*100)/100,norm:Math.round(Math.max(0,Math.min(1,(9-m*26/25*0.5)/1.5))*1000)/1000,feat:Math.round(ct)};
}
function tier(n){
if(n>=0.8)return{name:'sovereign insight',col:'#ba7517'};
if(n>=0.6)return{name:'deep processing',col:'#00ffb4'};
if(n>=0.3)return{name:'moderate depth',col:'#378add'};
return{name:'surface recall',col:'#888780'};
}

/* ═══ PRESETS ═══ */
const PR={
fire:{s:"What does fire need to burn?",i:"Why does fire spread once it starts?"},
money:{s:"What is inflation?",i:"Why does printing money cause prices to rise?"},
habit:{s:"What are habits?",i:"Why are habits hard to break once formed?"},
evolve:{s:"What is natural selection?",i:"Why does evolution speed up after mass extinctions?"},
trust:{s:"What is trust?",i:"Why does trust between strangers enable complex economies?"},
sleep:{s:"What happens during sleep?",i:"Why does sleep deprivation impair judgment before motor skills?"},
cancer:{s:"What is cancer?",i:"Why do some cancers resist treatment after initially responding?"},
city:{s:"What is urbanization?",i:"Why do cities produce more innovation per capita than rural areas?"}
};
window.P=k=>{document.getElementById('i1').value=PR[k].s;document.getElementById('i2').value=PR[k].i;};

/* ═══ SCAN ═══ */
window.scan=async function(){
const s1=document.getElementById('i1').value.trim();
const s2=document.getElementById('i2').value.trim();
if(!s1||!s2)return;

document.getElementById('hero').classList.add('faded');
const btn=document.getElementById('gobtn');
btn.disabled=true;btn.textContent='...';

document.getElementById('v1').textContent='—';document.getElementById('v1').style.color='rgba(180,200,220,0.1)';
document.getElementById('v2').textContent='—';document.getElementById('v2').style.color='rgba(180,200,220,0.1)';
document.getElementById('t1').textContent='scanning';document.getElementById('t1').style.color='rgba(180,200,220,0.15)';
document.getElementById('t2').textContent='scanning';document.getElementById('t2').style.color='rgba(180,200,220,0.15)';
document.getElementById('f1').textContent='';document.getElementById('f2').textContent='';
document.getElementById('verd').textContent='';

let pS,pI;

if(API_URL){
// Real API — call depth scorer
document.getElementById('stat').textContent='connecting to depth scorer...';
scanDur=22000; // real scoring takes ~22s
try{
const[r1,r2]=await Promise.all([
fetch(API_URL+'/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:s1})}),
fetch(API_URL+'/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:s2})})
]);
// Build profiles from real layer_profile data
const d1=await r1.json(),d2=await r2.json();
pS=d1.layer_profile||mkProf(textDepth(s1),hash(s1));
pI=d2.layer_profile||mkProf(textDepth(s2),hash(s2));
}catch(e){
document.getElementById('stat').textContent='scorer offline — using simulated profiles';
pS=mkProf(textDepth(s1),hash(s1));pI=mkProf(textDepth(s2),hash(s2));
}
}else{
pS=mkProf(textDepth(s1),hash(s1));
pI=mkProf(textDepth(s2),hash(s2));
scanDur=4000;
}

const w=window.innerWidth,h=window.innerHeight;
brainL=genOrg(0,0,pS);brainL.active=false;
brainR=genOrg(0,0,pI);brainR.active=false;

scanning=true;scanStart=performance.now();

const phases=['tracing early layers (L0-L7)...','processing mid-layer features...','reading output layers...','resolving computation graph...'];
for(let i=0;i<phases.length;i++){
document.getElementById('stat').textContent=phases[i];
await new Promise(r=>setTimeout(r,scanDur/4));
}

scanning=false;
brainL.active=true;brainR.active=true;

const scS=scoreP(pS),scI=scoreP(pI);
const tS=tier(scS.norm),tI=tier(scI.norm);

document.getElementById('v1').textContent=scS.norm.toFixed(3);document.getElementById('v1').style.color=tS.col;
document.getElementById('t1').textContent=tS.name;document.getElementById('t1').style.color=tS.col;
document.getElementById('f1').textContent=scS.feat.toLocaleString()+' features';document.getElementById('f1').style.color='rgba(180,200,220,0.3)';

document.getElementById('v2').textContent=scI.norm.toFixed(3);document.getElementById('v2').style.color=tI.col;
document.getElementById('t2').textContent=tI.name;document.getElementById('t2').style.color=tI.col;
document.getElementById('f2').textContent=scI.feat.toLocaleString()+' features';document.getElementById('f2').style.color='rgba(180,200,220,0.3)';

const delta=scI.norm-scS.norm;
document.getElementById('verd').textContent=
delta>0.15?`Insight prompt activates ${Math.round(delta*100)}% deeper across the network.`:
delta>0.05?'Moderate depth differential detected.':
'Similar computational depth for both prompts.';
document.getElementById('verd').style.color='rgba(180,200,220,0.35)';
