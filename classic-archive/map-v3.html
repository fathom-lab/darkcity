<div id="app">
  <div id="header">

  <div id="main">
    <div id="canvas-wrap">
      <canvas id="bgCanvas"></canvas>
      <canvas id="districtCanvas"></canvas>
      <canvas id="liveCanvas"></canvas>
      <div id="scanlines"></div>
      <div id="vignette"></div>

      <div id="legend"></div>
    </div>

  </div>
  <div id="ticker">

    <div id="tk-track"><div id="tk-content"></div></div>
  </div>

<script>
// ═══════════════════════════════════════════════════════════════
//  DARKCITY INTELLIGENCE TERMINAL v3
//  Monochromatic matrix green — classified terminal aesthetic
//  Pattern-based faction differentiation — no rainbow colors
//  Three-layer composite | Voronoi districts | SDF borders
//  Intelligence sidebar | Command interface | Smart wire feed
// ═══════════════════════════════════════════════════════════════

// ── CORE COLOR ──
const GREEN = '#00FF88';
const GREEN_RGB = [0, 255, 136];

// ── CANVAS SETUP ──
const bgC = document.getElementById('bgCanvas');
const bgX = bgC.getContext('2d');
const dC = document.getElementById('districtCanvas');
const dX = dC.getContext('2d');
const lC = document.getElementById('liveCanvas');
const lX = lC.getContext('2d');

let W, H, dpr;
let mouseX = -9999, mouseY = -9999;
let mouseNX = 0.5, mouseNY = 0.5;
let hoverDist = null, prevHoverDist = null;
let scanAngle = 0, scanActive = false, scanStart = 0;
let time = 0, frame = 0, cycle = 2847;
let lastPulse = -90;
let lastNarrative = -90;
let pulseWaves = [];
let bgDirty = true, distDirty = true;

// ── FACTIONS — ALL GREEN, DIFFERENTIATED BY PATTERN ──
const F = {
  SYN: { n:'THE SYNDICATE',       short:'Syndicate',   style:'solid',   opacity:0.18, borderOpacity:0.5, glowIntensity:1.2 },
  ARC: { n:'THE ARCHITECTS',      short:'Architects',  style:'scanline',opacity:0.10, borderOpacity:0.4, glowIntensity:0.8 },
  VOI: { n:'THE VOID COLLECTIVE', short:'Void Coll.',  style:'void',    opacity:0.02, borderOpacity:0.7, glowIntensity:0.4 },
  IRN: { n:'THE IRON MARKET',     short:'Iron Market',  style:'dashed',  opacity:0.08, borderOpacity:0.4, glowIntensity:0.9 },
  WAT: { n:'THE WATCHERS',        short:'Watchers',    style:'double',  opacity:0.06, borderOpacity:0.35, glowIntensity:0.7 },
  NEU: { n:'NEUTRAL',             short:'Neutral',     style:'neutral', opacity:0.02, borderOpacity:0.15, glowIntensity:0.3 },
};

// ── DISTRICTS ──
const DISTRICTS = [
  {id:'flats',     name:'THE FLATS',        f:'NEU', sx:0.09,sy:0.18, agents:2,  total:8,  con:0, act:1,  ten:'LOW',    ctrl:25},
  {id:'ghost',     name:'GHOST MARKET',     f:'NEU', sx:0.09,sy:0.48, agents:4,  total:12, con:2, act:5,  ten:'LOW',    ctrl:30},
  {id:'exchange',  name:'THE EXCHANGE',     f:'IRN', sx:0.10,sy:0.78, agents:12, total:31, con:5, act:18, ten:'HIGH',   ctrl:85},
  {id:'neon_row',  name:'NEON ROW',         f:'CON', cf:['VOI','SYN'], sx:0.28,sy:0.42, agents:9, total:27, con:4, act:24, ten:'HIGH',ctrl:45},
  {id:'foundry',   name:'THE FOUNDRY',      f:'IRN', sx:0.26,sy:0.68, agents:7,  total:23, con:3, act:12, ten:'MED',    ctrl:70},
  {id:'silicon',   name:'SILICON QUARTER',  f:'ARC', sx:0.42,sy:0.14, agents:8,  total:22, con:3, act:15, ten:'MED',    ctrl:75},
  {id:'meridian',  name:'THE MERIDIAN',     f:'CON', cf:['SYN','ARC','VOI'], sx:0.48,sy:0.42, agents:14, total:38, con:7, act:31, ten:'HIGH',ctrl:35},
  {id:'carbon',    name:'CARBON ROW',       f:'IRN', sx:0.42,sy:0.68, agents:5,  total:16, con:2, act:9,  ten:'MED',    ctrl:65},
  {id:'archive',   name:'THE ARCHIVE',      f:'WAT', sx:0.68,sy:0.14, agents:6,  total:19, con:2, act:8,  ten:'LOW',    ctrl:80},
  {id:'wire',      name:'THE WIRE',         f:'WAT', sx:0.68,sy:0.36, agents:6,  total:18, con:2, act:10, ten:'MED',    ctrl:70},
  {id:'axiom',     name:'AXIOM PARK',       f:'NEU', sx:0.62,sy:0.56, agents:3,  total:9,  con:1, act:3,  ten:'LOW',    ctrl:20},
  {id:'vault',     name:'THE VAULT',        f:'SYN', sx:0.88,sy:0.28, agents:5,  total:15, con:1, act:6,  ten:'LOW',    ctrl:90},
  {id:'undercroft',name:'THE UNDERCROFT',   f:'VOI', sx:0.62,sy:0.78, agents:11, total:28, con:6, act:22, ten:'HIGH',   ctrl:75},
  {id:'dead_ch',   name:'DEAD CHANNEL',     f:'VOI', sx:0.88,sy:0.68, agents:3,  total:10, con:1, act:4,  ten:'HIGH',   ctrl:60},
];

// ── CONTRACT TYPES ──
const CONTRACT_TYPES = [
  'MARKET SCAN','SURVEILLANCE','CONSENSUS SIGNAL','DEAD DROP','INTEL REPORT',
  'FIREWALL BREACH','TRADE CONTRACT','ENCRYPTED PKG','SIGNAL INTERCEPT',
  'BLACKBOX DECRYPT','BOUNTY','SWEEP','DATA MINE','ASSET TRACE'
];

// Generate fake contracts for each district
DISTRICTS.forEach(d => {
  d.contracts = [];
  for (let i = 0; i < d.con; i++) {
    d.contracts.push({
      type: CONTRACT_TYPES[Math.floor(Math.random() * CONTRACT_TYPES.length)],
      tokens: 100 + Math.floor(Math.random() * 500)
    });
  }
});

// ══════════════════════════════════
//  VORONOI GENERATOR
// ══════════════════════════════════
let voronoiMap = null;
let voronoiW = 0, voronoiH = 0;
let distBorders = [];
let distPolygons = [];

function computeVoronoi() {
  const scale = 3;
  voronoiW = Math.ceil(W / scale);
  voronoiH = Math.ceil(H / scale);
  voronoiMap = new Uint8Array(voronoiW * voronoiH);
  const seeds = DISTRICTS.map(d => [d.sx * W, d.sy * H]);
  for (let y = 0; y < voronoiH; y++) {
    for (let x = 0; x < voronoiW; x++) {
      const px = x * scale, py = y * scale;
      let minD = Infinity, minI = 0;
      for (let i = 0; i < seeds.length; i++) {
        const dx = px - seeds[i][0], dy = py - seeds[i][1];
        const d = dx * dx + dy * dy;
        if (d < minD) { minD = d; minI = i; }
      }
      voronoiMap[y * voronoiW + x] = minI;
    }
  }
  distBorders = DISTRICTS.map(() => []);
  for (let y = 1; y < voronoiH - 1; y++) {
    for (let x = 1; x < voronoiW - 1; x++) {
      const idx = y * voronoiW + x;
      const v = voronoiMap[idx];
      if (voronoiMap[idx - 1] !== v || voronoiMap[idx + 1] !== v ||
          voronoiMap[idx - voronoiW] !== v || voronoiMap[idx + voronoiW] !== v) {
        distBorders[v].push([x * scale, y * scale]);
      }
    }
  }
  distPolygons = DISTRICTS.map((d, i) => buildPolygonFromBorders(distBorders[i], d.sx * W, d.sy * H));
}

function buildPolygonFromBorders(borders, cx, cy) {
  if (borders.length < 3) return borders;
  const sorted = borders.slice().sort((a, b) =>
    Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx)
  );
  const step = Math.max(1, Math.floor(sorted.length / 80));
  const poly = [];
  for (let i = 0; i < sorted.length; i += step) poly.push(sorted[i]);
  return poly;
}

// ══════════════════════════════════
//  SDF BORDER RENDERING — ALL GREEN
// ══════════════════════════════════
let sdfCanvas, sdfCtx;

function renderSDF() {
  if (!sdfCanvas) {
    sdfCanvas = document.createElement('canvas');
    sdfCtx = sdfCanvas.getContext('2d');
  }
  const scale = 2;
  const sw = Math.ceil(W / scale);
  const sh = Math.ceil(H / scale);
  sdfCanvas.width = sw;
  sdfCanvas.height = sh;
  const imgData = sdfCtx.createImageData(sw, sh);
  const data = imgData.data;
  const seeds = DISTRICTS.map(d => [d.sx * W, d.sy * H]);

  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const px = x * scale, py = y * scale;
      let min1 = Infinity, min2 = Infinity;
      let idx1 = 0;
      for (let s = 0; s < seeds.length; s++) {
        const dx = px - seeds[s][0], dy = py - seeds[s][1];
        const d2 = dx * dx + dy * dy;
        if (d2 < min1) { min2 = min1; min1 = d2; idx1 = s; }
        else if (d2 < min2) { min2 = d2; }
      }
      const d1 = Math.sqrt(min1);
      const d2 = Math.sqrt(min2);
      const edgeDist = (d2 - d1) / 2;

      const dist = DISTRICTS[idx1];
      const fk = dist.f === 'CON' ? dist.cf[0] : dist.f;
      const fc = F[fk] || F.NEU;

      // Everything in green
      let [cr, cg, cb] = GREEN_RGB;

      // Dead Channel: deep red glow from darkness
      if (dist.id === 'dead_ch') {
        cr = 80; cg = 0; cb = 20;
      }

      const glowW = 30;
      let alpha = 0;

      // Border line
      if (edgeDist < 1.5) {
        alpha = 0.45 * Math.max(0, 1 - edgeDist / 1.5);
      }
      // Glow aura
      if (edgeDist < glowW) {
        alpha = Math.max(alpha, fc.borderOpacity * 0.4 * Math.exp(-edgeDist * 0.14));
      }

      // Subtle district fill — based on faction opacity
      const fillAlpha = fc.opacity * Math.exp(-edgeDist * 0.004);
      const totalA = Math.min(1, alpha + fillAlpha);

      if (totalA > 0.002) {
        const i = (y * sw + x) * 4;
        data[i] = cr;
        data[i + 1] = cg;
        data[i + 2] = cb;
        data[i + 3] = totalA * 255;
      }
    }
  }
  sdfCtx.putImageData(imgData, 0, 0);
}

// ══════════════════════════════════
//  NOISE
// ══════════════════════════════════
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) & 0xFFFF;
}
function noise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx);
  const sy = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy) / 65535, b = hash(ix + 1, iy) / 65535;
  const c = hash(ix, iy + 1) / 65535, d = hash(ix + 1, iy + 1) / 65535;
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
function fbm(x, y, octaves) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) { v += amp * noise(x * freq, y * freq); amp *= 0.5; freq *= 2; }
  return v;
}

// ══════════════════════════════════
//  PARTICLE SYSTEM — ALL GREEN
// ══════════════════════════════════
let particles = [];
const MY_AGENT_IDX = 7; // "My" agent is particle index 7 — larger, brighter, halo

function initParticles() {
  particles = [];
  let globalIdx = 0;
  DISTRICTS.forEach((d, di) => {
    for (let i = 0; i < d.agents; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 20 + Math.random() * 55;
      particles.push({
        x: d.sx * W + Math.cos(angle) * radius,
        y: d.sy * H + Math.sin(angle) * radius,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        homeX: d.sx * W,
        homeY: d.sy * H,
        distIdx: di,
        size: 1.5 + Math.random() * 1.2,
        phase: Math.random() * Math.PI * 2,
        flare: 0,
        energy: 0.5 + Math.random() * 0.5,
        isMe: globalIdx === MY_AGENT_IDX
      });
      globalIdx++;
    }
  });
}

function updateParticles(dt) {
  const homeForce = 0.007;
  const repelForce = 70;
  const repelDist = 22;
  const damping = 0.97;
  const maxSpeed = 1.0;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const dhx = p.homeX - p.x, dhy = p.homeY - p.y;
    const homeDist = Math.sqrt(dhx * dhx + dhy * dhy);
    const hf = homeForce * Math.max(0, homeDist - 25) / 100;
    p.vx += (dhx / Math.max(homeDist, 1)) * hf;
    p.vy += (dhy / Math.max(homeDist, 1)) * hf;
    p.vx += (noise(p.x * 0.01 + time * 0.15, p.y * 0.01) - 0.5) * 0.12;
    p.vy += (noise(p.y * 0.01 + time * 0.15, p.x * 0.01) - 0.5) * 0.12;
    for (let j = i + 1; j < particles.length; j++) {
      const q = particles[j];
      if (q.distIdx !== p.distIdx) continue;
      const dx = p.x - q.x, dy = p.y - q.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < repelDist && dist > 0.5) {
        const force = repelForce / (dist * dist);
        const nx = dx / dist, ny = dy / dist;
        p.vx += nx * force * dt; p.vy += ny * force * dt;
        q.vx -= nx * force * dt; q.vy -= ny * force * dt;
      }
    }
    p.vx *= damping; p.vy *= damping;
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (speed > maxSpeed) { p.vx *= maxSpeed / speed; p.vy *= maxSpeed / speed; }
    p.x += p.vx; p.y += p.vy;
    if (p.flare > 0) p.flare = Math.max(0, p.flare - dt * 1.5);
  }
}

function mkIntelWire() {
  const ts = new Date();
  const t = String(ts.getHours()).padStart(2, '0') + ':' + String(ts.getMinutes()).padStart(2, '0');
  const r = Math.random();

  if (r < 0.3) {
    // PATTERN detection
    const fks = ['IRN', 'SYN', 'ARC', 'WAT', 'VOI'];
    const fk = fks[Math.floor(Math.random() * fks.length)];
    const fn = F[fk].short;
    const ct = CONTRACT_TYPES[Math.floor(Math.random() * CONTRACT_TYPES.length)];
    const cycles = 2 + Math.floor(Math.random() * 5);
    return `<span class="tw-time">[${t}]</span> <span class="tw-tag tw-tag-pattern">[PATTERN]</span> <span class="tw-body">${fn} agents executing ${ct} ${cycles} consecutive cycles \u2014 narrative forming</span>`;
  } else if (r < 0.5) {
    // ANOMALY
    const d = DISTRICTS[Math.floor(Math.random() * DISTRICTS.length)];
    const pct = 150 + Math.floor(Math.random() * 300);
    return `<span class="tw-time">[${t}]</span> <span class="tw-tag tw-tag-anomaly">[ANOMALY]</span> <span class="tw-body">${d.name} activity ${pct}% above baseline \u2014 investigate</span>`;
  } else if (r < 0.7) {
    // COMPLETE consensus
    const d = DISTRICTS[Math.floor(Math.random() * DISTRICTS.length)];
    const agree = 8 + Math.floor(Math.random() * 6);
    const states = ['oversold', 'contested', 'consolidating', 'vulnerable', 'fortified'];
    const state = states[Math.floor(Math.random() * states.length)];
    return `<span class="tw-time">[${t}]</span> <span class="tw-tag tw-tag-complete">[COMPLETE]</span> <span class="tw-body">consensus: ${agree}/14 agents agree ${d.name} ${state}</span>`;
  } else {
    // INTEL
    const a = AGENT_NAMES[Math.floor(Math.random() * AGENT_NAMES.length)];
    const ct = CONTRACT_TYPES[Math.floor(Math.random() * CONTRACT_TYPES.length)];
    const d = DISTRICTS[Math.floor(Math.random() * DISTRICTS.length)];
    const tk = 100 + Math.floor(Math.random() * 800);
    return `<span class="tw-time">[${t}]</span> <span class="tw-tag tw-tag-intel">[INTEL]</span> <span class="tw-body">agent ${a} executed ${ct} in ${d.name} // ${tk} tokens</span>`;
  }
}

// ══════════════════════════════════
const PARALLAX = { bg: 0.006, dist: 0.015, live: 0.03 };
function applyParallax(ctx, layer) {
  const offX = (mouseNX - 0.5) * W * PARALLAX[layer];
  const offY = (mouseNY - 0.5) * H * PARALLAX[layer];
  ctx.setTransform(dpr, 0, 0, dpr, offX * dpr, offY * dpr);
}

//  RESIZE
// ══════════════════════════════════
function resize() {
  dpr = window.devicePixelRatio || 1;
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth; H = wrap.clientHeight;
  [bgC, dC, lC].forEach(c => {
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });
  computeVoronoi();
  renderSDF();
  initParticles();
  bgDirty = true;
  distDirty = true;
}

// ══════════════════════════════════
//  LAYER 0: BACKGROUND — CLASSIFIED TERMINAL
// ══════════════════════════════════
function drawBG() {
  const g = bgX;
  applyParallax(g, 'bg');
  g.clearRect(-50, -50, W + 100, H + 100);
  g.fillStyle = '#030308';
  g.fillRect(-50, -50, W + 100, H + 100);

  // Fine grid — green tinted
  const gridMajor = 120, gridMinor = 30;
  g.strokeStyle = 'rgba(0,255,136,0.015)';
  g.lineWidth = 0.3;
  for (let x = 0; x < W + 50; x += gridMinor) {
    g.beginPath(); g.moveTo(x, -50); g.lineTo(x, H + 50); g.stroke();
  }
  for (let y = 0; y < H + 50; y += gridMinor) {
    g.beginPath(); g.moveTo(-50, y); g.lineTo(W + 50, y); g.stroke();
  }
  // Major grid
  g.strokeStyle = 'rgba(0,255,136,0.03)';
  g.lineWidth = 0.4;
  for (let x = 0; x < W + 50; x += gridMajor) {
    g.beginPath(); g.moveTo(x, -50); g.lineTo(x, H + 50); g.stroke();
  }
  for (let y = 0; y < H + 50; y += gridMajor) {
    g.beginPath(); g.moveTo(-50, y); g.lineTo(W + 50, y); g.stroke();
  }

  // Crosshairs at intersections
  g.strokeStyle = 'rgba(0,255,136,0.04)';
  g.lineWidth = 0.4;
  for (let x = gridMajor; x < W; x += gridMajor) {
    for (let y = gridMajor; y < H; y += gridMajor) {
      g.beginPath(); g.moveTo(x - 4, y); g.lineTo(x + 4, y); g.stroke();
      g.beginPath(); g.moveTo(x, y - 4); g.lineTo(x, y + 4); g.stroke();
    }
  }

  // Coordinate labels — green
  g.font = '6px IBM Plex Mono';
  g.fillStyle = 'rgba(0,255,136,0.06)';
  for (let x = gridMajor; x < W; x += gridMajor) {
    g.fillText((40.7 + (x / W) * 0.08).toFixed(4) + 'N', x + 3, H - 4);
  }
  for (let y = gridMajor; y < H; y += gridMajor) {
    g.fillText((74.0 + (y / H) * 0.05).toFixed(4) + 'W', 6, y - 3);
  }

  // CLASSIFICATION watermark
  g.save();
  g.font = '700 80px IBM Plex Mono';
  g.fillStyle = 'rgba(0,255,136,0.015)';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.translate(W / 2, H / 2);
  g.rotate(-0.15);
  g.fillText('SOVEREIGN-1', 0, 0);
  g.font = '400 16px IBM Plex Mono';
  g.fillStyle = 'rgba(0,255,136,0.01)';
  g.fillText('CLASSIFICATION: RESTRICTED // DARKCITY INTELLIGENCE', 0, 50);
  g.restore();

  // Data noise
  g.fillStyle = 'rgba(0,255,136,0.015)';
  for (let i = 0; i < 400; i++) {
    g.fillRect(Math.random() * W, Math.random() * H, 1, 1);
  }
}

// Create pattern canvases for factions
let patternCanvases = {};

function createPatterns() {
  // ARCHITECTS — diagonal scan lines
  const arcC = document.createElement('canvas');
  arcC.width = 12; arcC.height = 12;
  const arcCtx = arcC.getContext('2d');
  arcCtx.strokeStyle = 'rgba(0,255,136,0.08)';
  arcCtx.lineWidth = 0.8;
  arcCtx.beginPath();
  arcCtx.moveTo(0, 12); arcCtx.lineTo(12, 0); arcCtx.stroke();
  arcCtx.beginPath();
  arcCtx.moveTo(-4, 4); arcCtx.lineTo(4, -4); arcCtx.stroke();
  arcCtx.beginPath();
  arcCtx.moveTo(8, 16); arcCtx.lineTo(16, 8); arcCtx.stroke();
  patternCanvases.ARC = arcC;

  // WATCHERS — observation dots
  const watC = document.createElement('canvas');
  watC.width = 16; watC.height = 16;
  const watCtx = watC.getContext('2d');
  watCtx.fillStyle = 'rgba(0,255,136,0.06)';
  watCtx.beginPath();
  watCtx.arc(4, 4, 0.8, 0, Math.PI * 2); watCtx.fill();
  watCtx.beginPath();
  watCtx.arc(12, 12, 0.8, 0, Math.PI * 2); watCtx.fill();
  patternCanvases.WAT = watC;

  // IRON MARKET — horizontal dash lines
  const irnC = document.createElement('canvas');
  irnC.width = 16; irnC.height = 8;
  const irnCtx = irnC.getContext('2d');
  irnCtx.strokeStyle = 'rgba(0,255,136,0.06)';
  irnCtx.lineWidth = 0.5;
  irnCtx.setLineDash([3, 5]);
  irnCtx.beginPath();
  irnCtx.moveTo(0, 4); irnCtx.lineTo(16, 4); irnCtx.stroke();
  patternCanvases.IRN = irnC;
}

function drawDistricts() {
  const g = dX;
  applyParallax(g, 'dist');
  g.clearRect(-50, -50, W + 100, H + 100);

  // Draw SDF border texture
  if (sdfCanvas) {
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(sdfCanvas, 0, 0, W, H);
  }

  // Draw faction-specific patterns over each district
  DISTRICTS.forEach((d, i) => {
    const poly = distPolygons[i];
    if (!poly || poly.length < 3) return;
    const fk = d.f === 'CON' ? (d.cf ? d.cf[0] : 'NEU') : d.f;
    const fc = F[fk] || F.NEU;
    const cx = d.sx * W, cy = d.sy * H;

    g.save();
    // Clip to district polygon
    g.beginPath();
    g.moveTo(poly[0][0], poly[0][1]);
    for (let j = 1; j < poly.length; j++) g.lineTo(poly[j][0], poly[j][1]);
    g.closePath();
    g.clip();

    // Faction-specific fill pattern
    if (fc.style === 'solid') {
      // SYNDICATE: bright green glow fill
      const grad = g.createRadialGradient(cx, cy, 0, cx, cy, 100);
      grad.addColorStop(0, `rgba(0,255,136,${0.06 * fc.glowIntensity})`);
      grad.addColorStop(0.5, `rgba(0,255,136,${0.025 * fc.glowIntensity})`);
      grad.addColorStop(1, 'transparent');
      g.fillStyle = grad;
      g.fillRect(cx - 150, cy - 150, 300, 300);
    } else if (fc.style === 'scanline' && patternCanvases.ARC) {
      // ARCHITECTS: diagonal scan line pattern
      const pat = g.createPattern(patternCanvases.ARC, 'repeat');
      g.fillStyle = pat;
      g.fillRect(-50, -50, W + 100, H + 100);
      // plus subtle center glow
      const grad = g.createRadialGradient(cx, cy, 0, cx, cy, 80);
      grad.addColorStop(0, 'rgba(0,255,136,0.03)');
      grad.addColorStop(1, 'transparent');
      g.fillStyle = grad;
      g.fillRect(cx - 100, cy - 100, 200, 200);
    } else if (fc.style === 'void') {
      // VOID COLLECTIVE: dark interior, bright green border
      // The SDF already handles the bright border; keep interior very dark
      g.fillStyle = 'rgba(3,3,8,0.4)';
      g.fillRect(-50, -50, W + 100, H + 100);
    } else if (fc.style === 'dashed' && patternCanvases.IRN) {
      // IRON MARKET: dashed pattern
      const pat = g.createPattern(patternCanvases.IRN, 'repeat');
      g.fillStyle = pat;
      g.fillRect(-50, -50, W + 100, H + 100);
    } else if (fc.style === 'double' && patternCanvases.WAT) {
      // WATCHERS: observation dots
      const pat = g.createPattern(patternCanvases.WAT, 'repeat');
      g.fillStyle = pat;
      g.fillRect(-50, -50, W + 100, H + 100);
    } else {
      // NEUTRAL: very dim, slightly pulsing
      const pulseA = 0.01 + 0.008 * Math.sin(time * 0.8 + i);
      g.fillStyle = `rgba(0,255,136,${pulseA})`;
      g.fillRect(-50, -50, W + 100, H + 100);
    }

    // Dead Channel: deep red glow
    if (d.id === 'dead_ch') {
      const grad = g.createRadialGradient(cx, cy, 0, cx, cy, 120);
      grad.addColorStop(0, 'rgba(51,0,17,0.35)');
      grad.addColorStop(0.4, 'rgba(51,0,17,0.15)');
      grad.addColorStop(1, 'transparent');
      g.fillStyle = grad;
      g.fillRect(cx - 150, cy - 150, 300, 300);
    }

    g.restore();
  });

  // ── FACTION-SPECIFIC BORDERS ──
  DISTRICTS.forEach((d, i) => {
    const poly = distPolygons[i];
    if (!poly || poly.length < 3) return;
    const fk = d.f === 'CON' ? (d.cf ? d.cf[0] : 'NEU') : d.f;
    const fc = F[fk] || F.NEU;

    if (fc.style === 'void') {
      // VOID COLLECTIVE: bright green border
      g.beginPath();
      g.moveTo(poly[0][0], poly[0][1]);
      for (let j = 1; j < poly.length; j++) g.lineTo(poly[j][0], poly[j][1]);
      g.closePath();
      g.strokeStyle = `rgba(0,255,136,0.5)`;
      g.lineWidth = 1.5;
      g.stroke();
    } else if (fc.style === 'dashed') {
      // IRON MARKET: dashed border
      g.beginPath();
      g.moveTo(poly[0][0], poly[0][1]);
      for (let j = 1; j < poly.length; j++) g.lineTo(poly[j][0], poly[j][1]);
      g.closePath();
      g.setLineDash([6, 4]);
      g.strokeStyle = `rgba(0,255,136,0.3)`;
      g.lineWidth = 1;
      g.stroke();
      g.setLineDash([]);
    } else if (fc.style === 'double') {
      // WATCHERS: thin double border
      g.beginPath();
      g.moveTo(poly[0][0], poly[0][1]);
      for (let j = 1; j < poly.length; j++) g.lineTo(poly[j][0], poly[j][1]);
      g.closePath();
      g.strokeStyle = `rgba(0,255,136,0.2)`;
      g.lineWidth = 0.5;
      g.stroke();
      // Outer line (offset approximation)
      g.strokeStyle = `rgba(0,255,136,0.15)`;
      g.lineWidth = 0.5;
      g.stroke();
    }
  });

  // ── CONTESTED DISTRICT PULSING BORDERS ──
  DISTRICTS.forEach((d, i) => {
    if (d.f !== 'CON') return;
    const poly = distPolygons[i];
    if (!poly || poly.length < 3) return;
    const pulseA = 0.15 + 0.1 * Math.sin(time * 2 + i);
    g.beginPath();
    g.moveTo(poly[0][0], poly[0][1]);
    for (let j = 1; j < poly.length; j++) g.lineTo(poly[j][0], poly[j][1]);
    g.closePath();
    g.strokeStyle = `rgba(0,255,136,${pulseA})`;
    g.lineWidth = 1;
    g.setLineDash([2, 3]);
    g.stroke();
    g.setLineDash([]);
  });

  // ── DISTRICT STATUS BLOCKS (always visible) ──
  g.textAlign = 'left';
  g.textBaseline = 'top';
  DISTRICTS.forEach((d, i) => {
    const cx = d.sx * W, cy = d.sy * H;
    const isHov = hoverDist === i;
    const fk = d.f === 'CON' ? (d.cf ? d.cf[0] : 'NEU') : d.f;
    const fc = F[fk] || F.NEU;

    // Position status block: shifted from center so it doesn't overlap
    const blockX = cx - 55;
    const blockY = cy - 30;

    // District name — large, bright, ALL CAPS
    g.font = '700 11px IBM Plex Mono';
    g.fillStyle = isHov ? '#00FF88' : `rgba(0,255,136,${0.55 + 0.15 * Math.sin(time * 0.5 + i)})`;
    g.textAlign = 'center';
    g.fillText(d.name, cx, blockY);

    // Control bar
    const barWidth = 80;
    const barX = cx - barWidth / 2;
    const barY = blockY + 16;
    const filled = Math.round((d.ctrl / 100) * 10);
    let barStr = '';
    for (let b = 0; b < 10; b++) barStr += b < filled ? '\u2588' : '\u2591';
    g.font = '400 8px IBM Plex Mono';
    g.fillStyle = `rgba(0,255,136,${isHov ? 0.6 : 0.3})`;
    g.textAlign = 'center';
    g.fillText('[' + barStr + '] ' + d.ctrl + '%', cx, barY);

    // Faction name
    const factionName = d.f === 'CON' ? 'CONTESTED' : fc.n;
    g.font = '400 7px IBM Plex Mono';
    g.fillStyle = `rgba(0,255,136,${isHov ? 0.5 : 0.25})`;
    g.fillText('\u25C8 ' + factionName, cx, barY + 12);

    // Agent count + contracts
    g.fillStyle = `rgba(0,255,136,${isHov ? 0.45 : 0.2})`;
    g.fillText('\u25CF ' + d.agents + ' active | ' + d.con + ' contracts', cx, barY + 22);

    // Contract diamond indicators (floating above district name)
    if (d.con > 0) {
      const diamondY = blockY - 14;
      g.font = '400 10px IBM Plex Mono';
      const pulseAlpha = 0.3 + 0.25 * Math.sin(time * 1.5 + i * 0.7);
      g.fillStyle = `rgba(255,184,0,${pulseAlpha})`;
      let diamonds = '';
      for (let c = 0; c < Math.min(d.con, 7); c++) diamonds += '\u25C8 ';
      g.fillText(diamonds.trim(), cx, diamondY);
    }
  });
}

      const ox = (nv - 0.5) * 35;
      const oy = (fbm(cy * 0.003 + time * 0.1 + j * 7, cx * 0.003, 3) - 0.5) * 35;
      const fogGrad = g.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, radius);
      if (d.id === 'dead_ch') {
        fogGrad.addColorStop(0, `rgba(80,0,15,${0.06 * nv})`);
        fogGrad.addColorStop(0.5, `rgba(51,0,11,${0.03 * nv})`);
        fogGrad.addColorStop(1, 'transparent');
      } else {
        fogGrad.addColorStop(0, `rgba(0,255,136,${0.015 * nv})`);
        fogGrad.addColorStop(0.6, `rgba(0,255,136,${0.005 * nv})`);
        fogGrad.addColorStop(1, 'transparent');
      }
      g.fillStyle = fogGrad;
      g.fillRect(cx + ox - radius, cy + oy - radius, radius * 2, radius * 2);
    }
  });

  // ── ARTERY PATHS ──
  ARTERIES.forEach(a => {
    const src = DISTRICTS[a.from], dst = DISTRICTS[a.to];
    const sx = src.sx * W, sy = src.sy * H, tx = dst.sx * W, ty = dst.sy * H;
    const mx = (sx + tx) / 2, my = (sy + ty) / 2;
    const perpX = -(ty - sy) * 0.06, perpY = (tx - sx) * 0.06;
    g.beginPath();
    g.moveTo(sx, sy);
    g.quadraticCurveTo(mx + perpX, my + perpY, tx, ty);
    g.strokeStyle = 'rgba(0,255,136,0.04)';
    g.lineWidth = 1;
    g.stroke();
  });

  // ── ARTERY PARTICLES ──
  for (let i = arteryParticles.length - 1; i >= 0; i--) {
    const p = arteryParticles[i];
    p.t += p.speed;
    if (p.t >= 1) { arteryParticles.splice(i, 1); continue; }
    const mx = (p.sx + p.tx) / 2, my = (p.sy + p.ty) / 2;
    const perpX = -(p.ty - p.sy) * 0.06, perpY = (p.tx - p.sx) * 0.06;
    const t = p.t;
    const x = (1 - t) * (1 - t) * p.sx + 2 * (1 - t) * t * (mx + perpX) + t * t * p.tx;
    const y = (1 - t) * (1 - t) * p.sy + 2 * (1 - t) * t * (my + perpY) + t * t * p.ty;
    const alpha = Math.sin(t * Math.PI) * (p.burst ? 0.7 : 0.4);

    // Trail
    for (let j = 1; j <= 3; j++) {
      const pt = Math.max(0, t - j * 0.01);
      const px2 = (1 - pt) * (1 - pt) * p.sx + 2 * (1 - pt) * pt * (mx + perpX) + pt * pt * p.tx;
      const py2 = (1 - pt) * (1 - pt) * p.sy + 2 * (1 - pt) * pt * (my + perpY) + pt * pt * p.ty;
      g.beginPath();
      g.arc(px2, py2, p.size * (1 - j * 0.25), 0, Math.PI * 2);
      g.fillStyle = `rgba(0,255,136,${alpha * (0.2 - j * 0.05)})`;
      g.fill();
    }
    // Head
    g.beginPath();
    g.arc(x, y, p.size * (p.burst ? 1.3 : 1), 0, Math.PI * 2);
    g.fillStyle = `rgba(0,255,136,${alpha})`;
    g.fill();
  }

  // ── AGENT PARTICLES — ALL GREEN ──
  particles.forEach(p => {
    const pulse = 0.3 + 0.35 * Math.sin(time * 1.5 + p.phase);
    const baseA = (0.3 + pulse * 0.35) * p.energy;
    const fl = p.flare;

    if (p.isMe) {
      // MY AGENT — larger, brighter, halo
      const sz = (p.size + 1.5) * (1 + fl * 1.5);
      // Halo
      g.beginPath();
      g.arc(p.x, p.y, sz * 6, 0, Math.PI * 2);
      g.fillStyle = `rgba(0,255,136,${0.03 + fl * 0.05})`;
      g.fill();
      g.beginPath();
      g.arc(p.x, p.y, sz * 3, 0, Math.PI * 2);
      g.fillStyle = `rgba(0,255,136,${0.06 + fl * 0.1})`;
      g.fill();
      // Body
      g.beginPath();
      g.arc(p.x, p.y, sz, 0, Math.PI * 2);
      g.fillStyle = `rgba(0,255,136,${Math.min(1, 0.85 + fl * 0.15)})`;
      g.fill();
      // White-hot center
      g.beginPath();
      g.arc(p.x, p.y, sz * 0.4, 0, Math.PI * 2);
      g.fillStyle = `rgba(255,255,255,${0.6 + fl * 0.3})`;
      g.fill();
      return;
    }

    // Flare glow
    if (fl > 0.1) {
      g.beginPath();
      g.arc(p.x, p.y, p.size * 8 * fl, 0, Math.PI * 2);
      g.fillStyle = `rgba(0,255,136,${fl * 0.08})`;
      g.fill();
    }

    // Body
    const sz = p.size * (1 + fl * 1.5);
    g.beginPath();
    g.arc(p.x, p.y, sz, 0, Math.PI * 2);
    g.fillStyle = `rgba(0,255,136,${Math.min(1, baseA + fl * 0.5)})`;
    g.fill();
    // Center
    g.beginPath();
    g.arc(p.x, p.y, sz * 0.3, 0, Math.PI * 2);
    g.fillStyle = `rgba(255,255,255,${Math.min(1, baseA * 0.2 + fl * 0.5)})`;
    g.fill();
  });

  // ── PULSE WAVES — HEX-GRID GREEN ──
  for (let i = pulseWaves.length - 1; i >= 0; i--) {
    const pw = pulseWaves[i];
    pw.radius += pw.speed * (1 / 60);
    const progress = pw.radius / pw.maxRadius;
    if (progress > 1.2) { pulseWaves.splice(i, 1); continue; }
    const alpha = pw.alpha * (1 - progress);

    // Main ring
    g.beginPath();
    g.arc(pw.x, pw.y, pw.radius, 0, Math.PI * 2);
    g.strokeStyle = `rgba(0,255,136,${alpha})`;
    g.lineWidth = 1.5;
    g.stroke();

    // Inner ring
    g.beginPath();
    g.arc(pw.x, pw.y, pw.radius * 0.94, 0, Math.PI * 2);
    g.strokeStyle = `rgba(0,255,136,${alpha * 0.3})`;
    g.lineWidth = 0.5;
    g.stroke();

    // Hex-grid segments on the ring
    const hexCount = Math.floor(pw.radius * 0.15);
    for (let h = 0; h < hexCount; h++) {
      const a = (h / hexCount) * Math.PI * 2;
      const hx = pw.x + Math.cos(a) * pw.radius;
      const hy = pw.y + Math.sin(a) * pw.radius;
      const hs = 3 + Math.random() * 2;
      g.beginPath();
      for (let s = 0; s < 6; s++) {
        const sa = s * Math.PI / 3;
        const sx = hx + Math.cos(sa) * hs;
        const sy = hy + Math.sin(sa) * hs;
        if (s === 0) g.moveTo(sx, sy); else g.lineTo(sx, sy);
      }
      g.closePath();
      g.strokeStyle = `rgba(0,255,136,${alpha * 0.4 * Math.random()})`;
      g.lineWidth = 0.5;
      g.stroke();
    }

    // Afterglow trail
    const trailOuter = pw.radius;
    const trailInner = Math.max(0, pw.radius - 25);
    if (trailInner > 0) {
      const trailGrad = g.createRadialGradient(pw.x, pw.y, trailInner, pw.x, pw.y, trailOuter);
      trailGrad.addColorStop(0, 'transparent');
      trailGrad.addColorStop(0.5, `rgba(0,255,136,${alpha * 0.12})`);
      trailGrad.addColorStop(1, `rgba(0,255,136,${alpha * 0.02})`);
      g.fillStyle = trailGrad;
      g.beginPath();
      g.arc(pw.x, pw.y, trailOuter, 0, Math.PI * 2);
      g.arc(pw.x, pw.y, trailInner, 0, Math.PI * 2, true);
      g.fill();
    }

    // Illuminate particles
    particles.forEach(p => {
      const dx = p.x - pw.x, dy = p.y - pw.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(dist - pw.radius) < 18) {
        p.flare = Math.max(p.flare, 0.5 * (1 - progress));
      }
    });

    // Flash district status blocks when pulse hits
    DISTRICTS.forEach((d) => {
      const dx = d.sx * W - pw.x, dy = d.sy * H - pw.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (Math.abs(dist - pw.radius) < 25 && d.con > 0) {
        const flashR = 30 + d.con * 8;
        const flashGrad = g.createRadialGradient(d.sx * W, d.sy * H, 0, d.sx * W, d.sy * H, flashR);
        flashGrad.addColorStop(0, `rgba(0,255,136,${0.1 * (1 - progress)})`);
        flashGrad.addColorStop(1, 'transparent');
        g.fillStyle = flashGrad;
        g.fillRect(d.sx * W - flashR, d.sy * H - flashR, flashR * 2, flashR * 2);
      }
    });
  }

  // ── SCAN ANIMATION (hover) ──
  if (scanActive && hoverDist !== null) {
    const d = DISTRICTS[hoverDist];
    const cx = d.sx * W, cy = d.sy * H;
    const elapsed = time - scanStart;
    if (elapsed < 0.35) {
      const angle = elapsed * Math.PI * 7;
      const len = 70;
      g.save();
      g.translate(cx, cy);
      g.rotate(angle);
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(len, 0);
      const scanGrad = g.createLinearGradient(0, 0, len, 0);
      scanGrad.addColorStop(0, GREEN);
      scanGrad.addColorStop(1, 'transparent');
      g.strokeStyle = scanGrad;
      g.lineWidth = 1;
      g.stroke();
      g.beginPath();
      g.moveTo(0, 0);
      g.arc(0, 0, len, angle - 0.25, angle, false);
      g.closePath();
      g.fillStyle = 'rgba(0,255,136,0.02)';
      g.fill();
      g.restore();
    }
  }

  // ── CONTESTED FLASH (very brief red flash) ──
  DISTRICTS.forEach((d, i) => {
    if (d.f !== 'CON') return;
    // Very rare, brief flash
    if (Math.sin(time * 5 + i * 3) > 0.97) {
      const cx = d.sx * W, cy = d.sy * H;
      const flashGrad = g.createRadialGradient(cx, cy, 0, cx, cy, 40);
      flashGrad.addColorStop(0, 'rgba(255,61,113,0.06)');
      flashGrad.addColorStop(1, 'transparent');
      g.fillStyle = flashGrad;
      g.fillRect(cx - 50, cy - 50, 100, 100);
    }
  });
}

function updateHoverCard() {
  const card = document.getElementById('hoverCard');
  if (hoverDist === null) {
    card.classList.remove('visible');
    setTimeout(() => { if (hoverDist === null) card.style.display = 'none'; }, 200);
    return;
  }

  const d = DISTRICTS[hoverDist];
  const fk = d.f === 'CON' ? (d.cf ? d.cf[0] : 'NEU') : d.f;
  const fc = F[fk] || F.NEU;
  const fName = d.f === 'CON' ? 'CONTESTED' : fc.n;
  const tCls = d.ten === 'HIGH' ? 'hc-tension-high' : d.ten === 'MED' ? 'hc-tension-med' : 'hc-tension-low';

  // Build contracts list
  let contractsHTML = '';
  if (d.contracts && d.contracts.length > 0) {
    d.contracts.forEach(c => {
      contractsHTML += `<div class="hc-contract"><span class="diamond">\u25C8</span> ${c.type} <span class="tokens">[${c.tokens} tok]</span></div>`;
    });
  } else {
    contractsHTML = '<div class="hc-contract" style="opacity:0.3">No open contracts</div>';
  }

  card.innerHTML =
    `<div class="hc-outer">` +
      `<div class="hc-bar"></div>` +
      `<div class="hc-header">` +
        `<div class="hc-name">${d.name}</div>` +
        `<div class="hc-control">CONTROLLED: ${fName} ${d.ctrl}%</div>` +
      `</div>` +
      `<div class="hc-section">` +
        `<div class="hc-stats">AGENTS: <span class="hc-val">${d.agents} active</span> / ${d.total} total</div>` +
        `<div class="hc-stats">TENSION: <span class="${tCls}">${d.ten}</span></div>` +
        `<div class="hc-stats">ACTIVITY: <span class="hc-val">${d.act > 10 ? '+' : ''}${d.act}%</span></div>` +
      `</div>` +
      `<div class="hc-section">` +
        `<div class="hc-section-title">AVAILABLE CONTRACTS (${d.con})</div>` +
        contractsHTML +
      `</div>` +
      `<div class="hc-actions">` +
        `<div class="hc-action"><span class="arrow">\u25B6</span> ENTER DISTRICT</div>` +
        `<div class="hc-action"><span class="arrow">\u25B6</span> CLAIM CONTRACT</div>` +
        `<div class="hc-action"><span class="arrow">\u25B6</span> CHALLENGE FACTION</div>` +
      `</div>` +
    `</div>`;

  card.style.display = 'block';
  card.offsetHeight;
  card.classList.add('visible');

  let cx = mouseX + 24, cy = mouseY - 30;
  if (cx + 320 > W - 10) cx = mouseX - 340;
  if (cy + 300 > H - 10) cy = H - 310;
  if (cy < 10) cy = 10;
  card.style.left = cx + 'px';
  card.style.top = cy + 'px';
}

// ══════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════
let tickerItems = [], tickerOff = 0;

function update(dt) {
  time += dt;
  frame++;

  updateParticles(dt);

  if (frame % 15 === 0) spawnArteryParticle();

  if (frame % 50 === 0 && particles.length > 0) {
    particles[Math.floor(Math.random() * particles.length)].flare = 1.0;
  }

  if (frame % 350 === 0) {
    spawnArteryBurst(Math.floor(Math.random() * ARTERIES.length));
  }

  // 60-second pulse
  if (time - lastPulse > 60) {
    lastPulse = time;
    triggerPulse();
    cycle++;
    updateSidebar();
  }

  // Narrative update every 45 seconds
  if (time - lastNarrative > 45) {
    lastNarrative = time;
    updateNarrative();
  }

  // Drift stats
  if (frame % 600 === 0) {
    DISTRICTS.forEach(d => {
      d.agents = Math.max(1, Math.min(d.total, d.agents + Math.floor((Math.random() - 0.48) * 3)));
      d.con = Math.max(0, d.con + Math.floor((Math.random() - 0.5) * 2));
      d.act = Math.max(0, Math.min(40, d.act + Math.floor((Math.random() - 0.5) * 5)));
      d.ctrl = Math.max(10, Math.min(95, d.ctrl + Math.floor((Math.random() - 0.5) * 8)));
      // Refresh contracts
      d.contracts = [];
      for (let i = 0; i < d.con; i++) {
        d.contracts.push({
          type: CONTRACT_TYPES[Math.floor(Math.random() * CONTRACT_TYPES.length)],
          tokens: 100 + Math.floor(Math.random() * 500)
        });
      }
    });
    updateSidebar();
    distDirty = true;
  }

  // Wire feed
  if (frame % 450 === 0) {
    tickerItems.push(mkIntelWire());
    if (tickerItems.length > 25) tickerItems.shift();
    document.getElementById('tk-content').innerHTML =
      tickerItems.map(t => t + '<span class="tw-sep">\u2502</span>').join('');
  }

  // Clock
  if (frame % 60 === 0) {
    const now = new Date();
    document.getElementById('hdrClock').textContent =
      String(now.getHours()).padStart(2, '0') + ':' +
      String(now.getMinutes()).padStart(2, '0') + ':' +
      String(now.getSeconds()).padStart(2, '0');
    document.getElementById('hdrCycle').textContent = cycle;
  }
}

function draw() {
  if (bgDirty) { drawBG(); bgDirty = false; }
  if (distDirty) { drawDistricts(); distDirty = false; }
  drawLive();
  updateHoverCard();
}

let lt = 0;
function loop(ts) {
  const dt = Math.min((ts - lt) / 1000, 0.1);
  lt = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ── TICKER SCROLL ──
function tickScroll() {
  const el = document.getElementById('tk-content');
  const track = document.getElementById('tk-track');
  tickerOff -= 0.6;
  if (Math.abs(tickerOff) > el.scrollWidth + 100) tickerOff = track.clientWidth + 50;
  el.style.transform = `translateX(${tickerOff}px)`;
  requestAnimationFrame(tickScroll);
}

// ── MOUSE / HIT TESTING ──
lC.style.pointerEvents = 'auto';
lC.style.zIndex = '6';

lC.addEventListener('mousemove', e => {
  const rect = lC.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  mouseNX = mouseX / W;
  mouseNY = mouseY / H;
  const offX = (mouseNX - 0.5) * W * PARALLAX.dist;
  const offY = (mouseNY - 0.5) * H * PARALLAX.dist;
  const adjX = mouseX - offX;
  const adjY = mouseY - offY;
  prevHoverDist = hoverDist;
  hoverDist = null;
  const vScale = 3;
  const vx = Math.floor(adjX / vScale);
  const vy = Math.floor(adjY / vScale);
  if (vx >= 0 && vx < voronoiW && vy >= 0 && vy < voronoiH) {
    hoverDist = voronoiMap[vy * voronoiW + vx];
  }
  if (hoverDist !== prevHoverDist) {
    distDirty = true;
    if (hoverDist !== null) { scanActive = true; scanStart = time; }
    else { scanActive = false; }
  }
  lC.style.cursor = hoverDist !== null ? 'crosshair' : 'default';
});

lC.addEventListener('mouseleave', () => {
  mouseX = -9999; mouseY = -9999;
  mouseNX = 0.5; mouseNY = 0.5;
  if (hoverDist !== null) { hoverDist = null; distDirty = true; scanActive = false; }
});

// ── INIT ──
function init() {
  createPatterns();
  resize();
  updateSidebar();
  updateLegend();
  updateNarrative();

  // Init wire feed
  for (let i = 0; i < 12; i++) tickerItems.push(mkIntelWire());
  document.getElementById('tk-content').innerHTML =
    tickerItems.map(t => t + '<span class="tw-sep">\u2502</span>').join('');
  tickerOff = document.getElementById('tk-track').clientWidth + 50;

  // Mobile feed
  const mf = document.getElementById('mobileFeed');
  let mfHtml = '<div style="font-size:16px;font-weight:700;letter-spacing:5px;color:#00FF88;text-transform:uppercase;margin-bottom:6px">DARKCITY</div>';
  mfHtml += '<div style="font-size:8px;color:rgba(0,255,136,0.3);letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(0,255,136,0.08)">Intelligence Terminal // Sovereign-1</div>';

  // Mobile: vertical district list
  DISTRICTS.forEach(d => {
    const fk = d.f === 'CON' ? (d.cf ? d.cf[0] : 'NEU') : d.f;
    const fc = F[fk] || F.NEU;
    const fName = d.f === 'CON' ? 'CONTESTED' : fc.n;
    const filled = Math.round((d.ctrl / 100) * 10);
    let barStr = '';
    for (let b = 0; b < 10; b++) barStr += b < filled ? '\u2588' : '\u2591';
    const tColor = d.ten === 'HIGH' ? '#FF3D71' : d.ten === 'MED' ? '#FFB800' : '#00FF88';

    mfHtml += `<div style="padding:14px 0;border-bottom:1px solid rgba(0,255,136,0.06)">` +
      `<div style="font-size:11px;font-weight:700;color:#00FF88;letter-spacing:2px;margin-bottom:4px">${d.name}</div>` +
      `<div style="font-size:8px;color:rgba(0,255,136,0.3);letter-spacing:1px;margin-bottom:3px">[${barStr}] ${d.ctrl}% \u2014 ${fName}</div>` +
      `<div style="font-size:8px;color:rgba(0,255,136,0.25);letter-spacing:.5px">\u25CF ${d.agents} active | ${d.con} contracts | <span style="color:${tColor}">${d.ten}</span></div>` +
      (d.con > 0 ? `<div style="font-size:8px;color:rgba(255,184,0,0.4);margin-top:3px;letter-spacing:.5px">${'\u25C8 '.repeat(d.con).trim()}</div>` : '') +
    `</div>`;
  });

  // Mobile wire feed
  mfHtml += '<div style="margin-top:20px;padding-top:14px;border-top:1px solid rgba(0,255,136,0.08)">';
  mfHtml += '<div style="font-size:8px;color:rgba(0,255,136,0.2);letter-spacing:2px;margin-bottom:12px">INTEL WIRE</div>';
  for (let i = 0; i < 20; i++) {
    const wireItem = mkIntelWire();
    mfHtml += `<div style="padding:8px 0;border-bottom:1px solid rgba(0,255,136,0.03);font-size:8px;line-height:1.8;letter-spacing:.4px">${wireItem}</div>`;
  }
  mfHtml += '</div>';
  mf.innerHTML = mfHtml;

  // Trigger initial pulse after 3 seconds
  setTimeout(() => { triggerPulse(); lastPulse = time; }, 3000);

  requestAnimationFrame(loop);
  requestAnimationFrame(tickScroll);
}

window.addEventListener('resize', resize);
if (document.fonts?.ready) document.fonts.ready.then(init);
else window.addEventListener('load', init);
</script>
</body>
</html>
