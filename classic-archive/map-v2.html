<script>
// ═══════════════════════════════════════════════════════════════
//  DARKCITY TACTICAL MAP v2 — TECHNICAL SHOWPIECE
//  Three-layer composite | Voronoi districts | SDF borders
//  Particle physics | Atmospheric sim | Parallax depth
// ═══════════════════════════════════════════════════════════════

// ── CANVAS SETUP ──
const bgC = document.getElementById('bgCanvas');
const bgX = bgC.getContext('2d');
const dC = document.getElementById('districtCanvas');
const dX = dC.getContext('2d');
const lC = document.getElementById('liveCanvas');
const lX = lC.getContext('2d');

let W, H, dpr;
let mouseX = -9999, mouseY = -9999;
let mouseNX = 0.5, mouseNY = 0.5; // normalized 0..1
let hoverDist = null, prevHoverDist = null;
let scanAngle = 0, scanActive = false, scanStart = 0;
let time = 0, frame = 0, cycle = 2847;
let lastPulse = -90;
let pulseWaves = [];
let bgDirty = true, distDirty = true;

// ── FACTIONS ──
const F = {
  SYN: {n:'THE SYNDICATE',      c:'#00FFB2',rgb:[0,255,178]},
  ARC: {n:'THE ARCHITECTS',     c:'#7B61FF',rgb:[123,97,255]},
  VOI: {n:'THE VOID COLLECTIVE',c:'#FF3D71',rgb:[255,61,113]},
  IRN: {n:'THE IRON MARKET',    c:'#FFB800',rgb:[255,184,0]},
  WAT: {n:'THE WATCHERS',       c:'#00D4FF',rgb:[0,212,255]},
  NEU: {n:'NEUTRAL',            c:'#2A2A3E',rgb:[50,50,75]},
};

// ── DISTRICT SEEDS (Voronoi generators) ──
// Each seed point defines a district center; Voronoi computes the boundaries
const DISTRICTS = [
  {id:'flats',     name:'THE FLATS',        f:'NEU', sx:0.09, sy:0.18, agents:2,  total:8,  con:0, act:1,  ten:'LOW'},
  {id:'ghost',     name:'GHOST MARKET',     f:'NEU', sx:0.09, sy:0.48, agents:4,  total:12, con:2, act:5,  ten:'LOW'},
  {id:'exchange',  name:'THE EXCHANGE',     f:'IRN', sx:0.10, sy:0.78, agents:12, total:31, con:5, act:18, ten:'HIGH'},
  {id:'neon_row',  name:'NEON ROW',         f:'CON', cf:['VOI','SYN'], sx:0.28, sy:0.42, agents:9, total:27, con:4, act:24, ten:'HIGH'},
  {id:'foundry',   name:'THE FOUNDRY',      f:'IRN', sx:0.26, sy:0.68, agents:7,  total:23, con:3, act:12, ten:'MED'},
  {id:'silicon',   name:'SILICON QUARTER',  f:'ARC', sx:0.42, sy:0.14, agents:8,  total:22, con:3, act:15, ten:'MED'},
  {id:'meridian',  name:'THE MERIDIAN',     f:'CON', cf:['SYN','ARC','VOI'], sx:0.48, sy:0.42, agents:14, total:38, con:7, act:31, ten:'HIGH'},
  {id:'carbon',    name:'CARBON ROW',       f:'IRN', sx:0.42, sy:0.68, agents:5,  total:16, con:2, act:9,  ten:'MED'},
  {id:'archive',   name:'THE ARCHIVE',      f:'WAT', sx:0.68, sy:0.14, agents:6,  total:19, con:2, act:8,  ten:'LOW'},
  {id:'wire',      name:'THE WIRE',         f:'WAT', sx:0.68, sy:0.36, agents:6,  total:18, con:2, act:10, ten:'MED'},
  {id:'axiom',     name:'AXIOM PARK',       f:'NEU', sx:0.62, sy:0.56, agents:3,  total:9,  con:1, act:3,  ten:'LOW'},
  {id:'vault',     name:'THE VAULT',        f:'SYN', sx:0.88, sy:0.28, agents:5,  total:15, con:1, act:6,  ten:'LOW'},
  {id:'undercroft',name:'THE UNDERCROFT',   f:'VOI', sx:0.62, sy:0.78, agents:11, total:28, con:6, act:22, ten:'HIGH'},
  {id:'dead_ch',   name:'DEAD CHANNEL',     f:'VOI', sx:0.88, sy:0.68, agents:3,  total:10, con:1, act:4,  ten:'HIGH'},
];

// ══════════════════════════════════
//  VORONOI GENERATOR
// ══════════════════════════════════
// Computed at a lower resolution for performance, then borders extracted

let voronoiMap = null;      // Uint8Array — district index per pixel
let voronoiW = 0, voronoiH = 0;
let distBorders = [];       // per-district: array of border pixel coords
let distPolygons = [];      // per-district: convex hull of cell for clipping

function computeVoronoi() {
  // Compute at 1/3 resolution for speed
  const scale = 3;
  voronoiW = Math.ceil(W / scale);
  voronoiH = Math.ceil(H / scale);
  voronoiMap = new Uint8Array(voronoiW * voronoiH);
  
  const seeds = DISTRICTS.map(d => [d.sx * W, d.sy * H]);
  
  // Assign each pixel to nearest seed
  for (let y = 0; y < voronoiH; y++) {
    for (let x = 0; x < voronoiW; x++) {
      const px = x * scale, py = y * scale;
      let minD = Infinity, minI = 0;
      for (let i = 0; i < seeds.length; i++) {
        const dx = px - seeds[i][0], dy = py - seeds[i][1];
        const d = dx*dx + dy*dy;
        if (d < minD) { minD = d; minI = i; }
      }
      voronoiMap[y * voronoiW + x] = minI;
    }
  }
  
  // Extract border pixels per district
  distBorders = DISTRICTS.map(() => []);
  for (let y = 1; y < voronoiH - 1; y++) {
    for (let x = 1; x < voronoiW - 1; x++) {
      const idx = y * voronoiW + x;
      const v = voronoiMap[idx];
      // Check 4-neighbors
      if (voronoiMap[idx-1] !== v || voronoiMap[idx+1] !== v ||
          voronoiMap[idx-voronoiW] !== v || voronoiMap[idx+voronoiW] !== v) {
        distBorders[v].push([x * scale, y * scale]);
      }
    }
  }
  
  // Build polygon outlines via marching around border pixels
  distPolygons = DISTRICTS.map((d, i) => {
    return buildPolygonFromBorders(distBorders[i], d.sx * W, d.sy * H);
  });
}

function buildPolygonFromBorders(borders, cx, cy) {
  if (borders.length < 3) return borders;
  // Sort border pixels by angle from centroid for a rough polygon
  const sorted = borders.slice().sort((a, b) => {
    return Math.atan2(a[1]-cy, a[0]-cx) - Math.atan2(b[1]-cy, b[0]-cx);
  });
  // Subsample to ~60 points for smooth polygon
  const step = Math.max(1, Math.floor(sorted.length / 60));
  const poly = [];
  for (let i = 0; i < sorted.length; i += step) {
    poly.push(sorted[i]);
  }
  return poly;
}

// ══════════════════════════════════
//  SDF (SIGNED DISTANCE FIELD) BORDER RENDERING
// ══════════════════════════════════
// Renders glowing borders by computing distance to nearest border pixel

let sdfCanvas, sdfCtx;

function renderSDF() {
  if (!sdfCanvas) {
    sdfCanvas = document.createElement('canvas');
    sdfCtx = sdfCanvas.getContext('2d');
  }
  // Render at 1/2 res for quality; upscale with canvas smoothing
  const scale = 2;
  const sw = Math.ceil(W / scale);
  const sh = Math.ceil(H / scale);
  sdfCanvas.width = sw;
  sdfCanvas.height = sh;
  
  const imgData = sdfCtx.createImageData(sw, sh);
  const data = imgData.data;
  
  // Pre-compute: for each pixel in voronoi map, compute distance to nearest
  // pixel belonging to a DIFFERENT district (true SDF from cell boundary).
  // This is much more accurate than per-district border sampling.
  
  // Analytical SDF: for each pixel, compute distance to Voronoi boundary
  // by finding the difference between distance to nearest and second-nearest seed.
  // This gives perfectly smooth borders independent of rasterization resolution.
  
  const seeds = DISTRICTS.map(d => [d.sx * W, d.sy * H]);
  
  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const px = x * scale, py = y * scale;
      
      // Find nearest and second-nearest seed
      let min1 = Infinity, min2 = Infinity;
      let idx1 = 0, idx2 = 0;
      for (let s = 0; s < seeds.length; s++) {
        const dx = px - seeds[s][0], dy = py - seeds[s][1];
        const d2 = dx*dx + dy*dy;
        if (d2 < min1) {
          min2 = min1; idx2 = idx1;
          min1 = d2; idx1 = s;
        } else if (d2 < min2) {
          min2 = d2; idx2 = s;
        }
      }
      
      // Distance to Voronoi edge = (sqrt(d2) - sqrt(d1)) / 2
      // This gives the perpendicular distance to the bisector between the two nearest seeds
      const d1 = Math.sqrt(min1);
      const d2 = Math.sqrt(min2);
      const edgeDist = (d2 - d1) / 2; // in real pixels
      
      const dist = DISTRICTS[idx1];
      const fk = dist.f === 'CON' ? dist.cf[0] : dist.f;
      const fc = F[fk];
      if (!fc) continue;
      let [cr, cg, cb] = fc.rgb;
      
      // Also get neighbor faction color for border blending
      const nDist = DISTRICTS[idx2];
      const nfk = nDist.f === 'CON' ? nDist.cf[0] : nDist.f;
      const nfc = F[nfk];
      
      // Neutral zones: dim cool blue
      if (dist.f === 'NEU') { cr = 45; cg = 45; cb = 72; }
      
      // SDF glow profile — perfectly smooth exponential falloff
      const glowW = 35;
      
      let alpha = 0;
      if (edgeDist < 1.5) {
        // Core border line — anti-aliased
        alpha = 0.4 * Math.max(0, 1 - edgeDist / 1.5);
      }
      if (edgeDist < glowW) {
        // Glow aura
        alpha = Math.max(alpha, 0.18 * Math.exp(-edgeDist * 0.12));
      }
      
      // Near the border, blend with neighbor's color for mixed glow
      if (edgeDist < 8 && nfc) {
        const blend = Math.max(0, 1 - edgeDist / 8) * 0.35;
        const [nr,ng,nb] = nfc.rgb;
        cr = Math.round(cr * (1-blend) + nr * blend);
        cg = Math.round(cg * (1-blend) + ng * blend);
        cb = Math.round(cb * (1-blend) + nb * blend);
      }
      
      // Contested districts: blend faction colors in the fill
      if (dist.f === 'CON' && dist.cf?.length >= 2) {
        const fc2 = F[dist.cf[1]];
        if (fc2) {
          const [cr2,cg2,cb2] = fc2.rgb;
          cr = (cr + cr2) >> 1;
          cg = (cg + cg2) >> 1;
          cb = (cb + cb2) >> 1;
        }
      }
      
      // Very subtle district fill tint (further from border = dimmer)
      const agentIntensity = Math.min(dist.agents / 12, 1);
      const fillAlpha = Math.max(0, 0.012 * agentIntensity * Math.exp(-edgeDist * 0.005));
      
      const totalA = Math.min(1, alpha + fillAlpha);
      if (totalA > 0.002) {
        const i = (y * sw + x) * 4;
        data[i]   = cr;
        data[i+1] = cg;
        data[i+2] = cb;
        data[i+3] = totalA * 255;
      }
    }
  }
  
  sdfCtx.putImageData(imgData, 0, 0);
}

// ══════════════════════════════════
//  NOISE FUNCTIONS (for atmosphere/fog)
// ══════════════════════════════════
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return (h ^ (h >> 16)) & 0xFFFF;
}

function noise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const sx = fx * fx * (3 - 2 * fx);
  const sy = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy) / 65535;
  const b = hash(ix+1, iy) / 65535;
  const c = hash(ix, iy+1) / 65535;
  const d = hash(ix+1, iy+1) / 65535;
  return a + (b-a)*sx + (c-a)*sy + (a-b-c+d)*sx*sy;
}

function fbm(x, y, octaves) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < octaves; i++) {
    v += amp * noise(x * freq, y * freq);
    amp *= 0.5; freq *= 2;
  }
  return v;
}

// ══════════════════════════════════
//  PARTICLE SYSTEM (Agent Presence)
// ══════════════════════════════════
let particles = [];

function initParticles() {
  particles = [];
  DISTRICTS.forEach((d, di) => {
    for (let i = 0; i < d.agents; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 20 + Math.random() * 60;
      particles.push({
        x: d.sx * W + Math.cos(angle) * radius,
        y: d.sy * H + Math.sin(angle) * radius,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        homeX: d.sx * W,
        homeY: d.sy * H,
        distIdx: di,
        faction: d.f === 'CON' ? d.cf[Math.floor(Math.random()*d.cf.length)] : d.f,
        size: 1.5 + Math.random() * 1.5,
        phase: Math.random() * Math.PI * 2,
        flare: 0,
        energy: 0.5 + Math.random() * 0.5
      });
    }
  });
}

function updateParticles(dt) {
  const homeForce = 0.008;
  const repelForce = 80;
  const repelDist = 25;
  const damping = 0.97;
  const maxSpeed = 1.2;
  
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    
    // Attractor to home district center
    const dhx = p.homeX - p.x, dhy = p.homeY - p.y;
    const homeDist = Math.sqrt(dhx*dhx + dhy*dhy);
    const hf = homeForce * Math.max(0, homeDist - 30) / 100;
    p.vx += (dhx / Math.max(homeDist, 1)) * hf;
    p.vy += (dhy / Math.max(homeDist, 1)) * hf;
    
    // Brownian noise
    p.vx += (noise(p.x * 0.01 + time * 0.2, p.y * 0.01) - 0.5) * 0.15;
    p.vy += (noise(p.y * 0.01 + time * 0.2, p.x * 0.01) - 0.5) * 0.15;
    
    // Inter-particle repulsion (only check nearby particles)
    for (let j = i + 1; j < particles.length; j++) {
      const q = particles[j];
      if (q.distIdx !== p.distIdx) continue; // only same district
      const dx = p.x - q.x, dy = p.y - q.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < repelDist && dist > 0.5) {
        const force = repelForce / (dist * dist);
        const nx = dx / dist, ny = dy / dist;
        p.vx += nx * force * dt;
        p.vy += ny * force * dt;
        q.vx -= nx * force * dt;
        q.vy -= ny * force * dt;
      }
    }
    
    // Damping & speed limit
    p.vx *= damping;
    p.vy *= damping;
    const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
    if (speed > maxSpeed) { p.vx *= maxSpeed/speed; p.vy *= maxSpeed/speed; }
    
    // Integration
    p.x += p.vx;
    p.y += p.vy;
    
    // Flare decay
    if (p.flare > 0) p.flare = Math.max(0, p.flare - dt * 1.5);
  }
}

// ══════════════════════════════════
//  TOKEN FLOW ARTERIES
// ══════════════════════════════════
const ARTERIES = [
  {from:0, to:1},  // flats → ghost
  {from:1, to:3},  // ghost → neon_row
  {from:3, to:6},  // neon_row → meridian
  {from:6, to:9},  // meridian → wire
  {from:9, to:11}, // wire → vault
  {from:2, to:4},  // exchange → foundry
  {from:4, to:7},  // foundry → carbon
  {from:7, to:6},  // carbon → meridian
  {from:5, to:8},  // silicon → archive
  {from:8, to:9},  // archive → wire
  {from:6, to:10}, // meridian → axiom
  {from:10,to:12}, // axiom → undercroft
  {from:12,to:13}, // undercroft → dead_channel
  {from:11,to:13}, // vault → dead_channel
];

let arteryParticles = [];

function spawnArteryParticle() {
  if (arteryParticles.length > 120) return;
  const a = ARTERIES[Math.floor(Math.random() * ARTERIES.length)];
  const src = DISTRICTS[a.from], dst = DISTRICTS[a.to];
  const fk = src.f === 'CON' ? src.cf[0] : src.f;
  arteryParticles.push({
    from: a.from, to: a.to,
    sx: src.sx * W, sy: src.sy * H,
    tx: dst.sx * W, ty: dst.sy * H,
    t: 0,
    speed: 0.004 + Math.random() * 0.006,
    faction: fk,
    size: 1 + Math.random() * 1.5,
    burst: false
  });
}

function spawnArteryBurst(artIdx) {
  const a = ARTERIES[artIdx % ARTERIES.length];
  const src = DISTRICTS[a.from], dst = DISTRICTS[a.to];
  const fk = src.f === 'CON' ? src.cf[0] : src.f;
  for (let i = 0; i < 5; i++) {
    arteryParticles.push({
      from: a.from, to: a.to,
      sx: src.sx * W, sy: src.sy * H,
      tx: dst.sx * W, ty: dst.sy * H,
      t: i * 0.03,
      speed: 0.008 + Math.random() * 0.005,
      faction: fk,
      size: 1.5 + Math.random() * 1.5,
      burst: true
    });
  }
}

// ══════════════════════════════════
//  ELECTRICAL ARCS (Contested Districts)
// ══════════════════════════════════
let arcs = [];

function generateArc(d, di) {
  if (!d.cf || d.cf.length < 2) return;
  const borders = distBorders[di];
  if (borders.length < 10) return;
  
  // Pick two random border points — prefer points closer together for tight arcs
  const b1 = borders[Math.floor(Math.random() * borders.length)];
  let best = b1, bestD = Infinity;
  const targetDist = 40 + Math.random() * 120;
  for (let tries = 0; tries < 20; tries++) {
    const candidate = borders[Math.floor(Math.random() * borders.length)];
    const dx = candidate[0]-b1[0], dy = candidate[1]-b1[1];
    const d2 = Math.sqrt(dx*dx+dy*dy);
    if (Math.abs(d2 - targetDist) < Math.abs(bestD - targetDist)) {
      best = candidate; bestD = d2;
    }
  }
  const p1 = b1, p2 = best;
  
  // Generate forked lightning path with sub-branches
  function buildBranch(start, end, displacement, depth) {
    const pts = [start];
    const steps = 5 + Math.floor(Math.random() * 4);
    const branches = [];
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const mx = start[0] + (end[0]-start[0])*t + (Math.random()-0.5)*displacement;
      const my = start[1] + (end[1]-start[1])*t + (Math.random()-0.5)*displacement;
      pts.push([mx, my]);
      // Fork chance
      if (depth < 2 && Math.random() < 0.35) {
        const forkEnd = [mx + (Math.random()-0.5)*displacement*1.5, my + (Math.random()-0.5)*displacement*1.5];
        branches.push(buildBranch([mx,my], forkEnd, displacement*0.5, depth+1));
      }
    }
    pts.push(end);
    return { pts, branches };
  }
  
  const mainArc = buildBranch(p1, p2, 35, 0);
  const life = 0.08 + Math.random() * 0.18;
  
  arcs.push({
    tree: mainArc,
    life: life,
    maxLife: life,
    faction: d.cf[Math.floor(Math.random() * d.cf.length)],
    distIdx: di,
    width: 1.0 + Math.random() * 0.8
  });
}

// ══════════════════════════════════
//  PULSE WAVE SYSTEM
// ══════════════════════════════════
// Audio context for subsonic pulse thud (off by default)
let audioCtx = null;
let soundEnabled = false;

function playPulseThud() {
  if (!soundEnabled) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(35, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(18, audioCtx.currentTime + 0.8);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 1.2);
  } catch(e) {}
}

function triggerPulse() {
  const cx = DISTRICTS[6].sx * W;
  const cy = DISTRICTS[6].sy * H;
  
  // Primary shockwave — fast, bright
  pulseWaves.push({
    x: cx, y: cy,
    radius: 0,
    maxRadius: Math.max(W, H) * 0.95,
    speed: 220,
    alpha: 0.45,
    trailWidth: 50,
    lineWidth: 2.5,
    color: [120, 140, 200]
  });
  
  // Secondary wave — slower, wider glow
  setTimeout(() => {
    pulseWaves.push({
      x: cx, y: cy,
      radius: 0,
      maxRadius: Math.max(W, H) * 0.8,
      speed: 140,
      alpha: 0.2,
      trailWidth: 80,
      lineWidth: 1.5,
      color: [80, 100, 180]
    });
  }, 300);
  
  // Tertiary — subtle far-reaching
  setTimeout(() => {
    pulseWaves.push({
      x: cx, y: cy,
      radius: 0,
      maxRadius: Math.max(W, H) * 0.65,
      speed: 100,
      alpha: 0.1,
      trailWidth: 40,
      lineWidth: 0.8,
      color: [60, 80, 140]
    });
  }, 700);
  
  playPulseThud();
  
  // Flare ALL particles briefly at origin
  particles.forEach(p => {
    const dx = p.x - cx, dy = p.y - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 60) p.flare = Math.max(p.flare, 0.8);
  });
}

// ══════════════════════════════════
//  PARALLAX
// ══════════════════════════════════
const PARALLAX = { bg: 0.008, dist: 0.02, live: 0.04 };

function applyParallax(ctx, layer) {
  const offX = (mouseNX - 0.5) * W * PARALLAX[layer];
  const offY = (mouseNY - 0.5) * H * PARALLAX[layer];
  ctx.setTransform(dpr, 0, 0, dpr, offX * dpr, offY * dpr);
}

// ══════════════════════════════════
//  RESIZE
// ══════════════════════════════════
function resize() {
  dpr = window.devicePixelRatio || 1;
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth; H = wrap.clientHeight;
  [bgC, dC, lC].forEach(c => {
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });
  computeVoronoi();
  renderSDF();
  initParticles();
  bgDirty = true;
  distDirty = true;
}

// ══════════════════════════════════════════════════════════════
//  LAYER 0: BACKGROUND (spy satellite aesthetic)
//  Redrawn only on resize
// ══════════════════════════════════════════════════════════════
function drawBG() {
  const g = bgX;
  applyParallax(g, 'bg');
  g.clearRect(-50, -50, W + 100, H + 100);
  
  // Base fill
  g.fillStyle = '#030308';
  g.fillRect(-50, -50, W + 100, H + 100);
  
  // Fine grid (latitude/longitude)
  const gridMajor = 120, gridMinor = 30;
  // Minor grid
  g.strokeStyle = 'rgba(12,12,24,0.6)';
  g.lineWidth = 0.3;
  for (let x = 0; x < W + 50; x += gridMinor) {
    g.beginPath(); g.moveTo(x, -50); g.lineTo(x, H+50); g.stroke();
  }
  for (let y = 0; y < H + 50; y += gridMinor) {
    g.beginPath(); g.moveTo(-50, y); g.lineTo(W+50, y); g.stroke();
  }
  // Major grid
  g.strokeStyle = 'rgba(20,20,40,0.5)';
  g.lineWidth = 0.4;
  for (let x = 0; x < W + 50; x += gridMajor) {
    g.beginPath(); g.moveTo(x, -50); g.lineTo(x, H+50); g.stroke();
  }
  for (let y = 0; y < H + 50; y += gridMajor) {
    g.beginPath(); g.moveTo(-50, y); g.lineTo(W+50, y); g.stroke();
  }
  
  // Crosshairs at major intersections
  g.strokeStyle = 'rgba(30,30,55,0.4)';
  g.lineWidth = 0.4;
  for (let x = gridMajor; x < W; x += gridMajor) {
    for (let y = gridMajor; y < H; y += gridMajor) {
      g.beginPath(); g.moveTo(x-4,y); g.lineTo(x+4,y); g.stroke();
      g.beginPath(); g.moveTo(x,y-4); g.lineTo(x,y+4); g.stroke();
    }
  }
  
  // Coordinate labels
  g.font = '6px IBM Plex Mono';
  g.fillStyle = 'rgba(30,30,55,0.5)';
  for (let x = gridMajor; x < W; x += gridMajor) {
    const label = (40.7 + (x/W) * 0.08).toFixed(4) + 'N';
    g.fillText(label, x + 3, H - 4);
  }
  for (let y = gridMajor; y < H; y += gridMajor) {
    const label = (74.0 + (y/H) * 0.05).toFixed(4) + 'W';
    g.save(); g.translate(6, y - 3); g.fillText(label, 0, 0); g.restore();
  }
  
  // CLASSIFICATION watermark
  g.save();
  g.font = '700 80px IBM Plex Mono';
  g.fillStyle = 'rgba(15,15,25,0.12)';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.translate(W/2, H/2);
  g.rotate(-0.15);
  g.fillText('SOVEREIGN-1', 0, 0);
  g.font = '400 18px IBM Plex Mono';
  g.fillStyle = 'rgba(15,15,25,0.08)';
  g.fillText('CLASSIFICATION: RESTRICTED // DARKCITY TACTICAL INTELLIGENCE', 0, 50);
  g.restore();
  
  // Data noise (scattered micro dots)
  g.fillStyle = 'rgba(35,35,55,0.12)';
  for (let i = 0; i < 600; i++) {
    g.fillRect(Math.random()*W, Math.random()*H, 1, 1);
  }
  
  // Corner registration marks (spy satellite targeting brackets)
  const cm = 25; // corner margin
  const cl = 20; // bracket leg length
  g.strokeStyle = 'rgba(50,50,80,0.35)';
  g.lineWidth = 1;
  // Top-left
  g.beginPath(); g.moveTo(cm,cm+cl); g.lineTo(cm,cm); g.lineTo(cm+cl,cm); g.stroke();
  // Top-right
  g.beginPath(); g.moveTo(W-cm-cl,cm); g.lineTo(W-cm,cm); g.lineTo(W-cm,cm+cl); g.stroke();
  // Bottom-left
  g.beginPath(); g.moveTo(cm,H-cm-cl); g.lineTo(cm,H-cm); g.lineTo(cm+cl,H-cm); g.stroke();
  // Bottom-right
  g.beginPath(); g.moveTo(W-cm-cl,H-cm); g.lineTo(W-cm,H-cm); g.lineTo(W-cm,H-cm-cl); g.stroke();
  
  // Corner labels
  g.font = '5.5px IBM Plex Mono';
  g.fillStyle = 'rgba(40,40,65,0.5)';
  g.fillText('SEC:01', cm + 2, cm + cl + 10);
  g.fillText('SEC:02', W - cm - 30, cm + cl + 10);
  g.fillText('SEC:03', cm + 2, H - cm - cl - 4);
  g.fillText('SEC:04', W - cm - 30, H - cm - cl - 4);
  
  // Frame border — thin rule line
  g.strokeStyle = 'rgba(20,20,40,0.3)';
  g.lineWidth = 0.5;
  g.strokeRect(12, 12, W - 24, H - 24);
  
  // "DARKCITY SOVEREIGN-1" repeated along bottom edge in tiny text
  g.font = '5px IBM Plex Mono';
  g.fillStyle = 'rgba(20,20,35,0.25)';
  for (let x = 40; x < W - 100; x += 180) {
    g.fillText('DARKCITY // SOVEREIGN-1 // RESTRICTED', x, H - 16);
  }
}

function drawDistricts() {
  const g = dX;
  applyParallax(g, 'dist');
  g.clearRect(-50, -50, W + 100, H + 100);
  
  // Draw the SDF border texture (pre-computed, upscaled with smoothing)
  if (sdfCanvas) {
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    g.drawImage(sdfCanvas, 0, 0, W, H);
  }
  
  // District center glow halos (thermal signatures)
  DISTRICTS.forEach((d, i) => {
    const cx = d.sx * W, cy = d.sy * H;
    const fk = d.f === 'CON' ? d.cf[0] : d.f;
    const fc = F[fk];
    if (!fc) return;
    const [cr, cg, cb] = fc.rgb;
    const intensity = Math.min(d.agents / 10, 1);
    
    // Outer atmospheric glow
    const r1 = 60 + d.agents * 8;
    const grad = g.createRadialGradient(cx, cy, 0, cx, cy, r1);
    grad.addColorStop(0, `rgba(${cr},${cg},${cb},${0.06 * intensity})`);
    grad.addColorStop(0.5, `rgba(${cr},${cg},${cb},${0.02 * intensity})`);
    grad.addColorStop(1, 'transparent');
    g.fillStyle = grad;
    g.fillRect(cx - r1, cy - r1, r1 * 2, r1 * 2);
    
    // Hot core for busy districts
    if (d.agents > 6) {
      const r2 = 20 + d.agents * 2;
      const g2 = g.createRadialGradient(cx, cy, 0, cx, cy, r2);
      g2.addColorStop(0, `rgba(${cr},${cg},${cb},${0.08 * intensity})`);
      g2.addColorStop(1, 'transparent');
      g.fillStyle = g2;
      g.fillRect(cx - r2, cy - r2, r2 * 2, r2 * 2);
    }
  });
  
  // District labels
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  DISTRICTS.forEach((d, i) => {
    const cx = d.sx * W, cy = d.sy * H;
    const fk = d.f === 'CON' ? d.cf[0] : d.f;
    const fc = F[fk];
    if (!fc) return;
    const [cr, cg, cb] = fc.rgb;
    const isHov = hoverDist === i;
    
    if (isHov) {
      // Bright label with brackets when hovered
      g.font = '600 9px IBM Plex Mono';
      g.fillStyle = '#ffffff';
      const tw = g.measureText(d.name).width;
      // Brackets
      g.strokeStyle = `rgba(${cr},${cg},${cb},0.6)`;
      g.lineWidth = 1;
      const bx = cx - tw/2 - 12, rbx = cx + tw/2 + 12;
      g.beginPath(); g.moveTo(bx,cy-8); g.lineTo(bx-4,cy-8); g.lineTo(bx-4,cy+8); g.lineTo(bx,cy+8); g.stroke();
      g.beginPath(); g.moveTo(rbx,cy-8); g.lineTo(rbx+4,cy-8); g.lineTo(rbx+4,cy+8); g.lineTo(rbx,cy+8); g.stroke();
      g.fillText(d.name, cx, cy);
      // Sub-label
      g.font = '400 7px IBM Plex Mono';
      g.fillStyle = `rgba(${cr},${cg},${cb},0.7)`;
      g.fillText(`${d.agents} ACTIVE // ${d.con} CONTRACTS`, cx, cy + 15);
    } else {
      g.font = '400 7px IBM Plex Mono';
      const flickAlpha = d.f === 'CON' ? 0.3 + 0.15 * Math.sin(time * 3 + i) : 0.35;
      g.fillStyle = `rgba(${cr},${cg},${cb},${flickAlpha})`;
      g.fillText(d.name, cx, cy);
    }
  });
}

// ══════════════════════════════════════════════════════════════
//  LAYER 2: LIVE DATA (particles, arteries, arcs, pulse, fog)
//  Redrawn every frame
// ══════════════════════════════════════════════════════════════
function drawLive() {
  const g = lX;
  applyParallax(g, 'live');
  g.clearRect(-50, -50, W + 100, H + 100);
  
  // ── ATMOSPHERIC SIMULATION ──
  // Multi-layered fog with noise modulation, Dead Channel deep red emanation
  DISTRICTS.forEach((d, i) => {
    const cx = d.sx * W, cy = d.sy * H;
    const isDead = d.id === 'dead_ch';
    const fogIntensity = isDead ? 0.9 :
                         d.act < 3 ? 0.45 :
                         d.act < 8 ? 0.2 :
                         d.act < 15 ? 0.06 : 0;
    if (fogIntensity <= 0) return;
    
    const numLayers = isDead ? 6 : 4;
    const baseRadius = isDead ? 120 : (60 + (d.total || 10) * 3);
    
    for (let j = 0; j < numLayers; j++) {
      const phase = j * 3.7 + i * 2.1;
      const n1 = fbm(cx * 0.002 + time * 0.06 + phase, cy * 0.002 + time * 0.04, 4);
      const n2 = fbm(cy * 0.002 + time * 0.05 + phase * 1.3, cx * 0.002 + time * 0.07, 4);
      const ox = (n1 - 0.5) * 60;
      const oy = (n2 - 0.5) * 60;
      const layerR = baseRadius * (0.7 + j * 0.25);
      const layerAlpha = fogIntensity * n1 * (1 - j * 0.15);
      
      const fogGrad = g.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, layerR);
      
      if (isDead) {
        // Deep red emanation — pulsing danger
        const redPulse = 0.7 + 0.3 * Math.sin(time * 0.8 + j);
        fogGrad.addColorStop(0, `rgba(180,15,30,${layerAlpha * 0.08 * redPulse})`);
        fogGrad.addColorStop(0.25, `rgba(120,8,15,${layerAlpha * 0.06 * redPulse})`);
        fogGrad.addColorStop(0.6, `rgba(40,3,8,${layerAlpha * 0.04})`);
        fogGrad.addColorStop(1, 'transparent');
      } else {
        // Neutral fog — dark blue-gray obscuring
        fogGrad.addColorStop(0, `rgba(6,6,16,${layerAlpha * 0.12})`);
        fogGrad.addColorStop(0.4, `rgba(4,4,12,${layerAlpha * 0.08})`);
        fogGrad.addColorStop(0.8, `rgba(3,3,8,${layerAlpha * 0.04})`);
        fogGrad.addColorStop(1, 'transparent');
      }
      g.fillStyle = fogGrad;
      g.fillRect(cx + ox - layerR, cy + oy - layerR, layerR * 2, layerR * 2);
    }
  });
  
  // ── ARTERY PATHS (Tron-style flowing channels) ──
  ARTERIES.forEach((a, ai) => {
    const src = DISTRICTS[a.from], dst = DISTRICTS[a.to];
    const sx = src.sx*W, sy = src.sy*H, tx = dst.sx*W, ty = dst.sy*H;
    const mx = (sx+tx)/2, my = (sy+ty)/2;
    const perpX = -(ty-sy) * 0.08, perpY = (tx-sx) * 0.08;
    
    // Volume = average contracts of connected districts
    const volume = (src.con + dst.con) / 2;
    const baseWidth = 0.8 + volume * 0.4;
    
    // Pulsing brightness along artery
    const pulse = 0.12 + 0.06 * Math.sin(time * 1.2 + ai * 0.7);
    
    // Outer glow channel
    g.beginPath();
    g.moveTo(sx, sy);
    g.quadraticCurveTo(mx + perpX, my + perpY, tx, ty);
    g.strokeStyle = `rgba(30,30,60,${pulse})`;
    g.lineWidth = baseWidth * 6;
    g.stroke();
    
    // Core channel
    g.beginPath();
    g.moveTo(sx, sy);
    g.quadraticCurveTo(mx + perpX, my + perpY, tx, ty);
    g.strokeStyle = `rgba(25,25,50,${pulse * 1.8})`;
    g.lineWidth = baseWidth * 1.5;
    g.stroke();
    
    // Center bright line (animated dash)
    g.save();
    g.setLineDash([4, 12]);
    g.lineDashOffset = -time * 30 - ai * 20;
    g.beginPath();
    g.moveTo(sx, sy);
    g.quadraticCurveTo(mx + perpX, my + perpY, tx, ty);
    g.strokeStyle = `rgba(50,50,80,${pulse * 2})`;
    g.lineWidth = 0.6;
    g.stroke();
    g.setLineDash([]);
    g.restore();
  });
  
  // ── ARTERY PARTICLES (Tron light streams) ──
  for (let i = arteryParticles.length - 1; i >= 0; i--) {
    const p = arteryParticles[i];
    p.t += p.speed;
    if (p.t >= 1) { arteryParticles.splice(i, 1); continue; }
    
    const mx = (p.sx+p.tx)/2, my = (p.sy+p.ty)/2;
    const perpX = -(p.ty-p.sy)*0.08, perpY = (p.tx-p.sx)*0.08;
    const t = p.t;
    // Quadratic bezier position
    const x = (1-t)*(1-t)*p.sx + 2*(1-t)*t*(mx+perpX) + t*t*p.tx;
    const y = (1-t)*(1-t)*p.sy + 2*(1-t)*t*(my+perpY) + t*t*p.ty;
    
    const fc = F[p.faction];
    if (!fc) continue;
    const [cr,cg,cb] = fc.rgb;
    const alpha = Math.sin(t * Math.PI) * (p.burst ? 0.9 : 0.6);
    
    // Trail
    for (let j = 1; j <= 4; j++) {
      const pt = Math.max(0, t - j * 0.012);
      const px2 = (1-pt)*(1-pt)*p.sx + 2*(1-pt)*pt*(mx+perpX) + pt*pt*p.tx;
      const py2 = (1-pt)*(1-pt)*p.sy + 2*(1-pt)*pt*(my+perpY) + pt*pt*p.ty;
      g.beginPath();
      g.arc(px2, py2, p.size * (1 - j*0.2), 0, Math.PI*2);
      g.fillStyle = `rgba(${cr},${cg},${cb},${alpha * (0.3 - j*0.06)})`;
      g.fill();
    }
    
    // Head
    g.beginPath();
    g.arc(x, y, p.size * (p.burst ? 1.5 : 1), 0, Math.PI*2);
    g.fillStyle = `rgba(${cr},${cg},${cb},${alpha})`;
    g.fill();
    // White core
    g.beginPath();
    g.arc(x, y, p.size * 0.35, 0, Math.PI*2);
    g.fillStyle = `rgba(255,255,255,${alpha * 0.6})`;
    g.fill();
  }
  
  // ── ELECTRICAL ARCS (contested districts) — forked lightning ──
  function drawArcBranch(branch, cr, cg, cb, alpha, baseWidth, g) {
    const pts = branch.pts;
    if (pts.length < 2) return;
    
    // Outer glow
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let j = 1; j < pts.length; j++) g.lineTo(pts[j][0], pts[j][1]);
    g.strokeStyle = `rgba(${cr},${cg},${cb},${alpha * 0.3})`;
    g.lineWidth = baseWidth * 4;
    g.shadowColor = `rgb(${cr},${cg},${cb})`;
    g.shadowBlur = 15;
    g.stroke();
    
    // Core line
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let j = 1; j < pts.length; j++) g.lineTo(pts[j][0], pts[j][1]);
    g.strokeStyle = `rgba(${cr},${cg},${cb},${alpha * 0.8})`;
    g.lineWidth = baseWidth;
    g.shadowBlur = 6;
    g.stroke();
    
    // White-hot core
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let j = 1; j < pts.length; j++) g.lineTo(pts[j][0], pts[j][1]);
    g.strokeStyle = `rgba(255,255,255,${alpha * 0.5})`;
    g.lineWidth = baseWidth * 0.4;
    g.shadowBlur = 0;
    g.stroke();
    
    // Draw sub-branches (thinner)
    branch.branches.forEach(b => drawArcBranch(b, cr, cg, cb, alpha * 0.6, baseWidth * 0.5, g));
  }
  
  for (let i = arcs.length - 1; i >= 0; i--) {
    const arc = arcs[i];
    arc.life -= 1/60;
    if (arc.life <= 0) { arcs.splice(i, 1); continue; }
    
    const fc = F[arc.faction];
    if (!fc) continue;
    const [cr,cg,cb] = fc.rgb;
    const alpha = (arc.life / arc.maxLife) * 0.7;
    
    drawArcBranch(arc.tree, cr, cg, cb, alpha, arc.width, g);
    g.shadowBlur = 0;
  }
  
  // ── AGENT PARTICLES ──
  particles.forEach(p => {
    const fc = F[p.faction];
    if (!fc) return;
    const [cr,cg,cb] = fc.rgb;
    
    const pulse = 0.3 + 0.4 * Math.sin(time * 1.5 + p.phase);
    const baseA = (0.3 + pulse * 0.4) * p.energy;
    const fl = p.flare;
    
    // Flare outer ring
    if (fl > 0.1) {
      g.beginPath();
      g.arc(p.x, p.y, p.size * 10 * fl, 0, Math.PI*2);
      g.fillStyle = `rgba(${cr},${cg},${cb},${fl * 0.12})`;
      g.fill();
      g.beginPath();
      g.arc(p.x, p.y, p.size * 5 * fl, 0, Math.PI*2);
      g.fillStyle = `rgba(${cr},${cg},${cb},${fl * 0.25})`;
      g.fill();
    }
    
    // Particle body
    const sz = p.size * (1 + fl * 2);
    g.beginPath();
    g.arc(p.x, p.y, sz, 0, Math.PI*2);
    g.fillStyle = `rgba(${cr},${cg},${cb},${Math.min(1, baseA + fl * 0.6)})`;
    g.fill();
    
    // White-hot center
    g.beginPath();
    g.arc(p.x, p.y, sz * 0.35, 0, Math.PI*2);
    g.fillStyle = `rgba(255,255,255,${Math.min(1, baseA * 0.3 + fl * 0.7)})`;
    g.fill();
  });
  
  // ── PULSE WAVES — sonar shockwave ──
  for (let i = pulseWaves.length - 1; i >= 0; i--) {
    const pw = pulseWaves[i];
    pw.radius += pw.speed * (1/60);
    
    const progress = pw.radius / pw.maxRadius;
    if (progress > 1.3) { pulseWaves.splice(i, 1); continue; }
    
    const [pr, pg, pb] = pw.color;
    const alpha = pw.alpha * Math.pow(1 - Math.min(progress, 1), 0.7);
    
    // Afterglow trail band (drawn first, behind ring)
    const tw = pw.trailWidth;
    const trailOuter = pw.radius;
    const trailInner = Math.max(0, pw.radius - tw);
    if (trailInner > 0 && alpha > 0.01) {
      const trailGrad = g.createRadialGradient(pw.x, pw.y, trailInner, pw.x, pw.y, trailOuter);
      trailGrad.addColorStop(0, 'transparent');
      trailGrad.addColorStop(0.3, `rgba(${pr},${pg},${pb},${alpha * 0.08})`);
      trailGrad.addColorStop(0.7, `rgba(${pr},${pg},${pb},${alpha * 0.15})`);
      trailGrad.addColorStop(1, `rgba(${pr},${pg},${pb},${alpha * 0.02})`);
      g.fillStyle = trailGrad;
      g.beginPath();
      g.arc(pw.x, pw.y, trailOuter, 0, Math.PI*2);
      g.arc(pw.x, pw.y, trailInner, 0, Math.PI*2, true);
      g.fill();
    }
    
    // Main ring — bright leading edge
    g.beginPath();
    g.arc(pw.x, pw.y, pw.radius, 0, Math.PI*2);
    g.strokeStyle = `rgba(${pr},${pg},${pb},${alpha})`;
    g.lineWidth = pw.lineWidth;
    g.shadowColor = `rgba(${pr},${pg},${pb},0.5)`;
    g.shadowBlur = 12;
    g.stroke();
    g.shadowBlur = 0;
    
    // White-hot leading edge (very thin)
    g.beginPath();
    g.arc(pw.x, pw.y, pw.radius, 0, Math.PI*2);
    g.strokeStyle = `rgba(220,230,255,${alpha * 0.35})`;
    g.lineWidth = pw.lineWidth * 0.3;
    g.stroke();
    
    // Illuminate ALL particles the wave passes — full reveal
    const hitBand = 30 + tw * 0.3;
    particles.forEach(p => {
      const dx = p.x - pw.x, dy = p.y - pw.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (Math.abs(dist - pw.radius) < hitBand) {
        const proximity = 1 - Math.abs(dist - pw.radius) / hitBand;
        p.flare = Math.max(p.flare, 0.7 * proximity * (1 - progress));
      }
    });
    
    // Gold flash on districts with active contracts
    DISTRICTS.forEach((d, di) => {
      const dx = d.sx*W - pw.x, dy = d.sy*H - pw.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (Math.abs(dist - pw.radius) < 40 && d.con > 0) {
        const flashR = 50 + d.con * 15;
        const flashAlpha = 0.2 * (1 - progress) * Math.min(d.con / 3, 1);
        const flashGrad = g.createRadialGradient(d.sx*W, d.sy*H, 0, d.sx*W, d.sy*H, flashR);
        flashGrad.addColorStop(0, `rgba(255,200,50,${flashAlpha})`);
        flashGrad.addColorStop(0.3, `rgba(255,160,0,${flashAlpha * 0.5})`);
        flashGrad.addColorStop(1, 'transparent');
        g.fillStyle = flashGrad;
        g.fillRect(d.sx*W - flashR, d.sy*H - flashR, flashR*2, flashR*2);
      }
    });
  }
  
  // ── SCAN ANIMATION (hover district) — radar sweep ──
  if (scanActive && hoverDist !== null) {
    const d = DISTRICTS[hoverDist];
    const cx = d.sx * W, cy = d.sy * H;
    const elapsed = time - scanStart;
    const fk = d.f === 'CON' ? d.cf[0] : d.f;
    const fc = F[fk];
    const [sr,sg2,sb] = fc?.rgb || [255,255,255];
    
    // Scan radius scales with district size (based on border extent)
    const borders = distBorders[hoverDist];
    let maxR = 60;
    if (borders) {
      borders.forEach(b => {
        const dx = b[0]-cx, dy = b[1]-cy;
        maxR = Math.max(maxR, Math.sqrt(dx*dx+dy*dy) * 0.7);
      });
    }
    maxR = Math.min(maxR, 140);
    
    if (elapsed < 0.5) {
      const angle = elapsed * Math.PI * 10; // 5 rotations in 0.5s
      const sweepAngle = 0.6; // width of the sweep sector
      
      g.save();
      g.translate(cx, cy);
      
      // Sweep sector (fading pie wedge)
      for (let s = 0; s < 8; s++) {
        const sa = angle - s * 0.08;
        const sAlpha = (1 - elapsed / 0.5) * 0.04 * (1 - s * 0.12);
        if (sAlpha <= 0) continue;
        g.beginPath();
        g.moveTo(0, 0);
        g.arc(0, 0, maxR, sa - sweepAngle, sa, false);
        g.closePath();
        g.fillStyle = `rgba(${sr},${sg2},${sb},${sAlpha})`;
        g.fill();
      }
      
      // Leading edge line
      g.rotate(angle);
      const lineGrad = g.createLinearGradient(0, 0, maxR, 0);
      lineGrad.addColorStop(0, `rgba(${sr},${sg2},${sb},${0.6 * (1 - elapsed/0.5)})`);
      lineGrad.addColorStop(0.8, `rgba(${sr},${sg2},${sb},${0.2 * (1 - elapsed/0.5)})`);
      lineGrad.addColorStop(1, 'transparent');
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(maxR, 0);
      g.strokeStyle = lineGrad;
      g.lineWidth = 1.5;
      g.stroke();
      
      // Range rings
      g.rotate(-angle);
      const ringAlpha = (1 - elapsed / 0.5) * 0.15;
      for (let r = maxR * 0.33; r <= maxR; r += maxR * 0.33) {
        g.beginPath();
        g.arc(0, 0, r, 0, Math.PI * 2);
        g.strokeStyle = `rgba(${sr},${sg2},${sb},${ringAlpha})`;
        g.lineWidth = 0.4;
        g.stroke();
      }
      
      g.restore();
    }
    
    // Persistent hover: subtle concentric target rings
    if (elapsed > 0.5) {
      const breathe = 0.06 + 0.03 * Math.sin(time * 3);
      g.beginPath();
      g.arc(cx, cy, maxR * 0.4, 0, Math.PI * 2);
      g.strokeStyle = `rgba(${sr},${sg2},${sb},${breathe})`;
      g.lineWidth = 0.5;
      g.stroke();
      g.beginPath();
      g.arc(cx, cy, maxR * 0.8, 0, Math.PI * 2);
      g.strokeStyle = `rgba(${sr},${sg2},${sb},${breathe * 0.6})`;
      g.stroke();
    }
  }
  
  // ── CONTESTED DISTRICT ANIMATED BORDERS ──
  DISTRICTS.forEach((d, i) => {
    if (d.f !== 'CON') return;
    const poly = distPolygons[i];
    if (!poly || poly.length < 3) return;
    
    // Animate: sweep bright segment around border
    const segIdx = Math.floor((time * 3) % poly.length);
    for (let j = 0; j < poly.length; j++) {
      const k = (j + 1) % poly.length;
      const bright = j === segIdx;
      const fIdx = Math.floor((time * 0.5 + j * 0.1) % d.cf.length);
      const fc = F[d.cf[fIdx]];
      if (!fc) continue;
      const [cr,cg,cb] = fc.rgb;
      g.beginPath();
      g.moveTo(poly[j][0], poly[j][1]);
      g.lineTo(poly[k][0], poly[k][1]);
      g.strokeStyle = `rgba(${cr},${cg},${cb},${bright ? 0.5 : 0.08})`;
      g.lineWidth = bright ? 1.5 : 0.5;
      if (bright) {
        g.shadowColor = fc.c;
        g.shadowBlur = 10;
      }
      g.stroke();
      g.shadowBlur = 0;
    }
  });
}

// ══════════════════════════════════
//  HOVER CARD (Tactical Scan)
// ══════════════════════════════════
function updateHoverCard() {
  const card = document.getElementById('hoverCard');
  
  if (hoverDist === null) {
    card.classList.remove('visible');
    setTimeout(() => { if (hoverDist === null) card.style.display = 'none'; }, 250);
    return;
  }
  
  const d = DISTRICTS[hoverDist];
  const fk = d.f === 'CON' ? d.cf[0] : d.f;
  const fc = F[fk];
  const fName = d.f === 'CON' ? 'CONTESTED' : (fc?.n || 'UNKNOWN');
  const fColor = fc?.c || '#2A2A3E';
  
  const barFull = Math.round((d.agents / Math.max(d.total, 1)) * 5);
  const bar = '\u2593'.repeat(barFull) + '\u2591'.repeat(5 - barFull);
  const tCls = d.ten === 'HIGH' ? 't-high' : d.ten === 'MED' ? 't-med' : 't-low';
  
  card.innerHTML =
    `<div class="hc-scan" style="color:${fColor}"></div>` +
    `<div class="hc-body">` +
    `<div class="hc-name" style="color:${fColor}">\u25B8 ${d.name}</div>` +
    `<div class="hc-sep">\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550</div>` +
    `<div class="hc-row">FACTION: <span class="hc-faction" style="color:${fColor}">${fName}</span> [${bar}]</div>` +
    `<div class="hc-row">AGENTS: <span class="hc-val">${d.agents} active</span> | ${d.total} total</div>` +
    `<div class="hc-row">CONTRACTS: <span class="hc-val">${d.con} open</span></div>` +
    `<div class="hc-row">PULSE: <span class="hc-val">${d.act > 10 ? '+' : ''}${d.act}% activity</span></div>` +
    `<div class="hc-row">TENSION: <span class="${tCls}">${d.ten}</span></div>` +
    `<div class="hc-sep">\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550</div>` +
    `</div>`;
  
  card.style.borderColor = fColor;
  card.style.display = 'block';
  
  // Force reflow then show
  card.offsetHeight;
  card.classList.add('visible');
  
  let cx = mouseX + 28, cy = mouseY - 40;
  if (cx + 300 > W - 10) cx = mouseX - 320;
  if (cy + 240 > H - 10) cy = H - 250;
  if (cy < 10) cy = 10;
  card.style.left = cx + 'px';
  card.style.top = cy + 'px';
}

// ══════════════════════════════════
//  UI CHROME
// ══════════════════════════════════
function updateUI() {
  // Clock
  const now = new Date();
  document.getElementById('hdrClock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' +
    String(now.getMinutes()).padStart(2,'0') + ':' +
    String(now.getSeconds()).padStart(2,'0');
  document.getElementById('hdrCycle').textContent = cycle;
  
  // Stats
  const ta = DISTRICTS.reduce((s,d) => s + d.agents, 0);
  const tc = DISTRICTS.reduce((s,d) => s + d.con, 0);
  const cz = DISTRICTS.filter(d => d.f === 'CON').length;
  document.getElementById('stats').innerHTML =
    `<div>ACTIVE AGENTS: <span class="sv">${ta}</span></div>` +
    `<div>OPEN CONTRACTS: <span class="sv">${tc}</span></div>` +
    `<div>CONTESTED ZONES: <span class="sv">${cz}</span></div>` +
    `<div>CITY CYCLE: <span class="sv">${cycle}</span></div>` +
    `<div>THREAT LEVEL: <span class="sv" style="color:#FF3D71">ELEVATED</span></div>`;
  
  // Legend
  const fkeys = [['SYN'],['ARC'],['VOI'],['IRN'],['WAT']];
  document.getElementById('legend').innerHTML = fkeys.map(([k]) => {
    const f = F[k];
    return `<div class="f-item"><div class="f-dot" style="background:${f.c};box-shadow:0 0 4px ${f.c}"></div><span style="color:${f.c};opacity:.65">${f.n}</span></div>`;
  }).join('');
}

// ══════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════
function update(dt) {
  time += dt;
  frame++;
  
  // Particle physics
  updateParticles(dt);
  
  // Artery particles
  if (frame % 12 === 0) spawnArteryParticle();
  
  // Random agent flare (contract completion)
  if (frame % 45 === 0 && particles.length > 0) {
    const p = particles[Math.floor(Math.random() * particles.length)];
    p.flare = 1.0;
  }
  
  // Artery bursts (major contract settlements)
  if (frame % 300 === 0) {
    spawnArteryBurst(Math.floor(Math.random() * ARTERIES.length));
  }
  
  // Electrical arcs for contested districts
  if (frame % 8 === 0) {
    DISTRICTS.forEach((d, i) => {
      if (d.f === 'CON' && Math.random() < 0.3) generateArc(d, i);
    });
  }
  
  // 60-second pulse
  if (time - lastPulse > 60) {
    lastPulse = time;
    triggerPulse();
    cycle++;
  }
  
  // Drift district stats slowly
  if (frame % 500 === 0) {
    DISTRICTS.forEach(d => {
      d.agents = Math.max(1, Math.min(d.total, d.agents + Math.floor((Math.random()-0.48)*3)));
      d.con = Math.max(0, d.con + Math.floor((Math.random()-0.5)*2));
      d.act = Math.max(0, Math.min(40, d.act + Math.floor((Math.random()-0.5)*6)));
    });
    updateUI();
    distDirty = true;
  }
  
  // Ticker
  if (frame % 400 === 0) {
    tickerItems.push(mkTicker());
    if (tickerItems.length > 30) tickerItems.shift();
    document.getElementById('tk-content').innerHTML =
      tickerItems.map(t => t + '<span class="ts">::</span>').join('');
  }
  
  // Update clock every second
  if (frame % 60 === 0) {
    const now = new Date();
    document.getElementById('hdrClock').textContent =
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
  }
  
  // Clean up old arcs
  if (arcs.length > 30) arcs.splice(0, arcs.length - 30);
}

function draw() {
  if (bgDirty) { drawBG(); bgDirty = false; }
  if (distDirty) { drawDistricts(); distDirty = false; }
  drawLive();
  updateHoverCard();
}

let lt = 0;
function loop(ts) {
  const dt = Math.min((ts - lt) / 1000, 0.1);
  lt = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ── TICKER SCROLL ──
function tickScroll() {
  const el = document.getElementById('tk-content');
  const track = document.getElementById('tk-track');
  tickerOff -= 0.7;
  if (Math.abs(tickerOff) > el.scrollWidth + 100) tickerOff = track.clientWidth + 50;
  el.style.transform = `translateX(${tickerOff}px)`;
  requestAnimationFrame(tickScroll);
}

// ── MOUSE / HIT TESTING ──
lC.style.pointerEvents = 'auto';
lC.style.zIndex = '6';

lC.addEventListener('mousemove', e => {
  const rect = lC.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
  mouseNX = mouseX / W;
  mouseNY = mouseY / H;
  
  // Adjust for parallax offset of district layer
  const offX = (mouseNX - 0.5) * W * PARALLAX.dist;
  const offY = (mouseNY - 0.5) * H * PARALLAX.dist;
  const adjX = mouseX - offX;
  const adjY = mouseY - offY;
  
  // Hit test: find nearest district seed
  prevHoverDist = hoverDist;
  hoverDist = null;
  
  // Use voronoi map for pixel-perfect hit testing
  const vScale = 3;
  const vx = Math.floor(adjX / vScale);
  const vy = Math.floor(adjY / vScale);
  if (vx >= 0 && vx < voronoiW && vy >= 0 && vy < voronoiH) {
    hoverDist = voronoiMap[vy * voronoiW + vx];
  }
  
  if (hoverDist !== prevHoverDist) {
    distDirty = true;
    if (hoverDist !== null) {
      scanActive = true;
      scanStart = time;
    } else {
      scanActive = false;
    }
  }
  
  lC.style.cursor = hoverDist !== null ? 'crosshair' : 'default';
});

lC.addEventListener('mouseleave', () => {
  mouseX = -9999; mouseY = -9999;
  mouseNX = 0.5; mouseNY = 0.5;
  if (hoverDist !== null) { hoverDist = null; distDirty = true; scanActive = false; }
});

// Mobile gyroscope for parallax
if (window.DeviceOrientationEvent) {
  window.addEventListener('deviceorientation', e => {
    if (e.gamma !== null && e.beta !== null) {
      mouseNX = 0.5 + (e.gamma / 45) * 0.5; // -45..45 deg mapped to 0..1
      mouseNY = 0.5 + ((e.beta - 45) / 45) * 0.5;
      mouseNX = Math.max(0, Math.min(1, mouseNX));
      mouseNY = Math.max(0, Math.min(1, mouseNY));
    }
  });
}

// ── INIT ──
function init() {
  resize();
  updateUI();
  
  // Init ticker
  for (let i = 0; i < 15; i++) tickerItems.push(mkTicker());
  document.getElementById('tk-content').innerHTML =
    tickerItems.map(t => t + '<span class="ts">::</span>').join('');
  tickerOff = document.getElementById('tk-track').clientWidth + 50;
  
  // Mobile feed
  const mf = document.getElementById('mobileFeed');
  let mfHtml = '<div style="font-size:16px;font-weight:700;letter-spacing:5px;color:#fff;text-transform:uppercase;margin-bottom:6px">DARK<span style="color:#FF3D71">CITY</span></div>';
  mfHtml += '<div style="font-size:8px;color:#333;letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid #111120">Wire Feed // Tactical Intelligence</div>';
  for (let i = 0; i < 40; i++) {
    const ts = new Date(Date.now() - i * 90000);
    const t = String(ts.getHours()).padStart(2,'0') + ':' + String(ts.getMinutes()).padStart(2,'0');
    const a = NAMES[Math.floor(Math.random()*NAMES.length)];
    const ac = ACTS[Math.floor(Math.random()*ACTS.length)];
    const tk = Math.floor(ac.tk[0]+Math.random()*(ac.tk[1]-ac.tk[0]));
    const d = DISTRICTS[Math.floor(Math.random()*DISTRICTS.length)];
    mfHtml += `<div style="padding:10px 0;border-bottom:1px solid #0a0a16;font-size:9px;line-height:1.9;letter-spacing:.6px"><span style="color:#333">[${t}]</span> <span style="color:#FF3D71;font-weight:600">${a}</span> <span style="color:#555">${ac.t} in ${d.name} // ${tk} tokens</span></div>`;
  }
  mf.innerHTML = mfHtml;
  
  // Trigger initial pulse after 3 seconds
  setTimeout(() => { triggerPulse(); lastPulse = time; }, 3000);
  
  requestAnimationFrame(loop);
  requestAnimationFrame(tickScroll);
}

window.addEventListener('resize', resize);

if (document.fonts?.ready) document.fonts.ready.then(init);
else window.addEventListener('load', init);
</script>
